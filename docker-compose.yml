services:
  lobby:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install -q -r requirements.txt && uvicorn server:app --host 0.0.0.0 --port 8090"
    ports: ["8090:8090"]
    volumes:
      - ./:/app
      - ./data:/data            # users.db + auth secret live here
    environment:
      ROOT_USERNAME: ${ROOT_USERNAME:-}   # optional: seeds the first admin account
      ROOT_PASSWORD: ${ROOT_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-} # optional: AI-generated characters / variants
      GROQ_API_KEY: ${GROQ_API_KEY:-}     # optional: voice check in Learn
