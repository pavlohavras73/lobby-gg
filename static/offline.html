<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>Lobby.gg — нет связи</title>
<style>
  html, body { margin: 0; height: 100%; background: #050507; color: #f2f2f5;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .box { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; box-sizing: border-box; text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; color: #9a9aa4; max-width: 320px; line-height: 1.5; }
  button { margin-top: 8px; border: 0; border-radius: 14px; padding: 12px 22px; font: inherit; font-weight: 700;
    color: #fff; background: #e0102e; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <img src="/games/static/icons/icon-192.png" alt="">
  <h1 id="t">Нет подключения к интернету</h1>
  <p id="d">Как только связь появится — нажми «Повторить».</p>
  <button id="b" onclick="location.reload()">Повторить</button>
</div>
<script>
  const L = (localStorage.getItem("jg_lang") || "ru");
  const T = {
    uk: ["Немає підключення до інтернету", "Щойно зʼявиться звʼязок — натисни «Повторити».", "Повторити"],
    en: ["No internet connection", "As soon as you're back online, tap “Retry”.", "Retry"],
    de: ["Keine Internetverbindung", "Sobald du wieder online bist, tippe auf „Erneut versuchen“.", "Erneut versuchen"],
  }[L];
  if (T) { document.getElementById("t").textContent = T[0]; document.getElementById("d").textContent = T[1];
           document.getElementById("b").textContent = T[2]; document.documentElement.lang = L; }
</script>
</body>
</html>
