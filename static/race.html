<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title data-i18n="title">Неоновые Гонки</title>
  <link rel="icon" type="image/svg+xml" href="/games/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/games/static/theme.css">
  <link rel="stylesheet" href="/games/static/game-ui.css">
  <style>
    * { box-sizing: border-box; }
    body {
      background: #040610;
      overflow: hidden;
      touch-action: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: max(6px, var(--sat)) max(10px, var(--sar)) max(8px, var(--sab)) max(10px, var(--sal));
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-user-select: none;
      user-select: none;
    }
    .game-topbar { max-width: 440px; width: 100%; margin-bottom: 4px; flex: none; }
    .hud-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      width: 100%; max-width: 440px; margin: 2px auto 4px; flex: none; flex-wrap: wrap;
    }
    .langbar {
      display: flex; gap: 3px; background: rgba(255,255,255,.05);
      border: 1px solid var(--border); border-radius: 999px; padding: 3px;
    }
    .langbar button {
      width: auto; border: 0; background: transparent; color: var(--muted);
      font: inherit; font-weight: 800; font-size: 11px; padding: 4px 8px;
      border-radius: 999px; cursor: pointer;
    }
    .langbar button.active { background: var(--crimson); color: #fff; box-shadow: 0 0 12px rgba(255,34,56,.4); }
    #laneSelect {
      width: auto; margin: 0; padding: 5px 22px 5px 8px; font-size: 11.5px; font-weight: 700;
      border-radius: 10px;
    }
    .score-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.06); border: 1px solid var(--border-hi);
      border-radius: 999px; padding: 4px 10px; font-weight: 800; font-size: 12px; white-space: nowrap;
    }
    .canvas-container {
      position: relative; flex: 1; width: 100%; max-width: 440px; min-height: 0;
      margin: 4px 0; border-radius: 18px; overflow: hidden;
      border: 1px solid rgba(56,189,248,.28);
      box-shadow: 0 0 32px rgba(14,165,233,.18), 0 12px 30px rgba(0,0,0,.65);
      background: #040615;
    }
    #gameCanvas {
      width: 100%; height: 100%; display: block;
    }
    .race-hud {
      position: absolute; top: 8px; left: 8px; right: 8px; z-index: 5;
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 1.25fr; gap: 6px;
      pointer-events: none;
    }
    .rh-box {
      background: rgba(8, 12, 24, 0.72); border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      border-radius: 10px; padding: 4px 6px; text-align: center;
    }
    .rh-l { font-size: 9px; text-transform: uppercase; letter-spacing: .4px; color: #94a3b8; font-weight: 800; }
    .rh-v { font-size: 13px; font-weight: 900; color: #fff; white-space: nowrap; }
    .nitro-bar {
      width: 100%; height: 6px; border-radius: 999px; margin-top: 4px;
      background: rgba(255,255,255,.12); overflow: hidden;
    }
    .nitro-fill {
      height: 100%; width: 45%; border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8, #a855f7, #f43f5e);
      transition: width .08s linear;
    }
    .biome-toast {
      position: absolute; top: 56px; left: 50%; transform: translateX(-50%); z-index: 6;
      background: rgba(8,12,26,.8); border: 1px solid rgba(56,189,248,.35);
      border-radius: 999px; padding: 4px 12px; font-size: 11px; font-weight: 800; color: #bae6fd;
      pointer-events: none; opacity: 0; transition: opacity .25s ease; white-space: nowrap;
    }
    .biome-toast.show { opacity: 1; }
    .controls {
      display: grid; grid-template-columns: 1fr 0.85fr 1fr; gap: 10px;
      width: 100%; max-width: 440px; padding: 4px 0 2px; flex: none;
    }
    .control-button {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text); border-radius: 16px; padding: 14px 0;
      font-size: 1.5em; font-weight: 900; cursor: pointer;
      display: flex; justify-content: center; align-items: center; gap: 6px;
      box-shadow: var(--inner); margin: 0;
      transition: transform .08s, background .12s, border-color .12s;
    }
    .control-button:active {
      transform: scale(0.93);
      background: rgba(255, 34, 56, 0.24);
      border-color: var(--crimson);
    }
    .nitro-btn {
      font-size: 13px; letter-spacing: .5px; color: #bae6fd;
      border-color: rgba(56, 189, 248, 0.3);
      background: rgba(14, 165, 233, 0.12);
    }
    .nitro-btn.ready {
      color: #fff; border-color: #38bdf8;
      background: linear-gradient(135deg, rgba(14,165,233,.42), rgba(168,85,247,.38));
      box-shadow: 0 0 18px rgba(56,189,248,.32);
    }
    .nitro-btn:disabled { opacity: .45; cursor: not-allowed; }
    @media (max-width: 360px) {
      .langbar button { font-size: 10px; padding: 3px 6px; }
      #laneSelect { font-size: 11px; padding: 4px 20px 4px 6px; }
      .score-pill { font-size: 11px; padding: 3px 8px; }
      .rh-v { font-size: 11.5px; }
      .control-button { padding: 11px 0; }
    }
  </style>
</head>
<body>
<header class="game-topbar">
  <a href="/games/" class="top-back" data-i18n="back_btn">‹ Игры</a>
  <div class="topbar-title" data-i18n="page_title">🏎️ Гонки</div>
  <button type="button" id="rulesBtn" class="top-icon-btn" onclick="window.LobbyUI ? LobbyUI.rules('race') : document.getElementById('rulesModal').style.display='flex'" title="Правила" data-i18n-title="rules_title">i</button>
</header>

<div id="rulesModal" data-dismiss="backdrop" onclick="if(event.target===this)this.style.display='none'" style="display:none;position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.74);align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px)">
  <div style="max-width:380px;width:100%;background:#15151b;border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:20px;text-align:left">
    <div style="font-size:19px;font-weight:800;margin-bottom:10px" data-i18n="rules_title">🏎️ Гонки — правила</div>
    <div style="font-size:14px;line-height:1.6;color:#d8d8de" data-i18n="rules_body">Объезжай машины и барьеры свайпами, стрелками или кнопками. Собирай 🪙 монеты для бонусной дистанции и заряда ⚡ Нитро!</div>
    <button type="button" onclick="document.getElementById('rulesModal').style.display='none'" style="margin-top:16px;width:100%;padding:11px;border-radius:10px;border:none;background:var(--crimson,#e0102e);color:#fff;font-weight:700;cursor:pointer" data-i18n="rules_ok">Понятно 👍</button>
  </div>
</div>

<div class="hud-bar">
  <div class="langbar" id="langbar">
    <button type="button" data-lang="uk">УКР</button>
    <button type="button" data-lang="ru">РУС</button>
    <button type="button" data-lang="en">ENG</button>
    <button type="button" data-lang="de">DEU</button>
  </div>
  <select id="laneSelect" data-i18n-title="lanes_title" title="Кол-во полос">
    <option value="2" data-i18n="lane_2">2 полосы</option>
    <option value="3" data-i18n="lane_3">3 полосы</option>
    <option value="4" data-i18n="lane_4">4 полосы</option>
  </select>
  <div class="score-pill">🏆 <span id="best-display">0</span><span data-i18n="score_suffix">м</span></div>
</div>

<div class="canvas-container" id="canvasContainer">
  <canvas id="gameCanvas"></canvas>
  <div class="race-hud">
    <div class="rh-box"><div class="rh-l" data-i18n="hud_dist">Дист.</div><div class="rh-v"><span id="score-display">0</span><span data-i18n="score_suffix">м</span></div></div>
    <div class="rh-box"><div class="rh-l" data-i18n="hud_spd">Скор.</div><div class="rh-v"><span id="hudSpeed">125</span></div></div>
    <div class="rh-box"><div class="rh-l" data-i18n="hud_coins">Монеты</div><div class="rh-v">🪙 <span id="hudCoins">0</span></div></div>
    <div class="rh-box">
      <div class="rh-l" data-i18n="hud_nitro">Нитро</div>
      <div class="nitro-bar"><div class="nitro-fill" id="nitroFill"></div></div>
    </div>
  </div>
  <div class="biome-toast" id="biomeToast"></div>
</div>

<div class="controls">
  <button type="button" class="control-button" id="leftButton" aria-label="Left">
    <svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button type="button" class="control-button nitro-btn" id="nitroButton">⚡ NITRO</button>
  <button type="button" class="control-button" id="rightButton" aria-label="Right">
    <svg viewBox="0 0 24 24" width="26" height="26"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<script src="/games/static/ui.js"></script>
<script src="/games/static/arcade_fx.js"></script>
<script src="/games/static/race/engine.js"></script>
<script src="/games/static/sfx.js"></script>
<script>
const UI = {
  uk: {
    title: "Неонові Перегони — Lobby.gg",
    rules_title: "🏎️ Перегони — правила",
    rules_body: "Об'їжджай машини та бар'єри свайпами, стрілками чи кнопками. Збирай 🪙 монети для бонусної дистанції та заряду ⚡ Нітро!",
    rules_ok: "Зрозуміло 👍",
    back_btn: "‹ Ігри",
    page_title: "🏎️ Перегони",
    lanes_title: "Кіл-ть смуг",
    lane_2: "2 смуги",
    lane_3: "3 смуги",
    lane_4: "4 смуги",
    hud_dist: "Дист.",
    hud_spd: "Швидк.",
    hud_coins: "Монети",
    hud_nitro: "Нітро",
    score_suffix: "м",
    biome_city: "🌃 Нічне місто",
    biome_desert: "🏜️ Західний каньйон",
    biome_coast: "🌴 Прибережна траса",
    over_title: "Аварія на трасі!",
    stat_coins: "🪙 Монети",
    stat_maxspd: "⚡ Макс. км/год"
  },
  ru: {
    title: "Неоновые Гонки — Lobby.gg",
    rules_title: "🏎️ Гонки — правила",
    rules_body: "Объезжай машины и барьеры свайпами, стрелками или кнопками. Собирай 🪙 монеты для бонусной дистанции и заряда ⚡ Нитро!",
    rules_ok: "Понятно 👍",
    back_btn: "‹ Игры",
    page_title: "🏎️ Гонки",
    lanes_title: "Кол-во полос",
    lane_2: "2 полосы",
    lane_3: "3 полосы",
    lane_4: "4 полосы",
    hud_dist: "Дист.",
    hud_spd: "Скор.",
    hud_coins: "Монеты",
    hud_nitro: "Нитро",
    score_suffix: "м",
    biome_city: "🌃 Ночной город",
    biome_desert: "🏜️ Закатный каньон",
    biome_coast: "🌴 Прибрежная трасса",
    over_title: "Авария на трассе!",
    stat_coins: "🪙 Монеты",
    stat_maxspd: "⚡ Макс. км/ч"
  },
  en: {
    title: "Neon Racing — Lobby.gg",
    rules_title: "🏎️ Racing — rules",
    rules_body: "Dodge traffic and roadblocks using swipes, arrows, or buttons. Collect 🪙 coins for bonus distance and ⚡ Nitro charge!",
    rules_ok: "Got it 👍",
    back_btn: "‹ Games",
    page_title: "🏎️ Racing",
    lanes_title: "Lanes",
    lane_2: "2 lanes",
    lane_3: "3 lanes",
    lane_4: "4 lanes",
    hud_dist: "Dist.",
    hud_spd: "Speed",
    hud_coins: "Coins",
    hud_nitro: "Nitro",
    score_suffix: "m",
    biome_city: "🌃 Neon City",
    biome_desert: "🏜️ Sunset Canyon",
    biome_coast: "🌴 Coastal Highway",
    over_title: "Wrecked!",
    stat_coins: "🪙 Coins",
    stat_maxspd: "⚡ Top km/h"
  },
  de: {
    title: "Neon Racing — Lobby.gg",
    rules_title: "🏎️ Racing — Regeln",
    rules_body: "Weiche Fahrzeugen und Barrieren per Wischgeste, Pfeilen oder Tasten aus. Sammle 🪙 Münzen für Extrastrecke und ⚡ Nitro!",
    rules_ok: "Verstanden 👍",
    back_btn: "‹ Spiele",
    page_title: "🏎️ Racing",
    lanes_title: "Spuren",
    lane_2: "2 Spuren",
    lane_3: "3 Spuren",
    lane_4: "4 Spuren",
    hud_dist: "Strecke",
    hud_spd: "Tempo",
    hud_coins: "Münzen",
    hud_nitro: "Nitro",
    score_suffix: "m",
    biome_city: "🌃 Neon-Stadt",
    biome_desert: "🏜️ Sonnen-Canyon",
    biome_coast: "🌴 Küstenstraße",
    over_title: "Unfall!",
    stat_coins: "🪙 Münzen",
    stat_maxspd: "⚡ Max km/h"
  }
};

let LANG = localStorage.getItem('jg_lang') || 'ru';
if (!UI[LANG]) LANG = 'ru';
const t = k => (UI[LANG] && UI[LANG][k] !== undefined) ? UI[LANG][k] : (UI.ru[k] || k);
const IS_DEBUG = location.search.includes('debug=1');

function applyUI() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t(el.dataset.i18n);
    if (typeof v !== 'string') return;
    if (el.tagName.toLowerCase() === 'title') document.title = v;
    else el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = t(el.dataset.i18nTitle));
  document.querySelectorAll('#langbar button').forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
  if (window.ArcadeFX) ArcadeFX.refreshI18n(LANG);
}

let savedLanes = parseInt(localStorage.getItem('race-lanes') || '3', 10);
if (savedLanes < 2 || savedLanes > 4 || Number.isNaN(savedLanes)) savedLanes = 3;
const laneSelect = document.getElementById('laneSelect');
laneSelect.value = String(savedLanes);

const scoreEl = document.getElementById('score-display');
const speedEl = document.getElementById('hudSpeed');
const coinsEl = document.getElementById('hudCoins');
const nitroFillEl = document.getElementById('nitroFill');
const nitroBtn = document.getElementById('nitroButton');
const bestEl = document.getElementById('best-display');
const biomeToastEl = document.getElementById('biomeToast');
let biomeToastTimer = 0;

function showBiomeToast(id) {
  biomeToastEl.textContent = t('biome_' + id);
  biomeToastEl.classList.add('show');
  clearTimeout(biomeToastTimer);
  biomeToastTimer = setTimeout(() => biomeToastEl.classList.remove('show'), 2200);
}

function updateBestLabel() {
  bestEl.textContent = localStorage.getItem('jg_race_best') || '0';
}

const canvas = document.getElementById('gameCanvas');
const engine = new window.RaceEngine(canvas, {
  numLanes: savedLanes,
  onHud: h => {
    scoreEl.textContent = h.distance;
    speedEl.textContent = h.speed;
    coinsEl.textContent = h.coins;
    nitroFillEl.style.width = Math.round(h.nitro) + '%';
    const canNitro = !h.nitroActive && h.nitro >= 35;
    nitroBtn.disabled = !canNitro;
    nitroBtn.classList.toggle('ready', canNitro);
  },
  onBiomeChange: (idx, id) => {
    showBiomeToast(id);
  },
  onCoin: () => {
    if (window.LobbyUI) LobbyUI.sound('click');
  },
  onCrashSound: () => {
    if (window.LobbyUI) LobbyUI.sound('err');
  },
  onCrash: info => {
    const prevBest = parseInt(localStorage.getItem('jg_race_best') || '0', 10);
    const isNewRecord = !IS_DEBUG && info.distance > prevBest && info.distance > 0;
    const best = isNewRecord ? info.distance : Math.max(prevBest, IS_DEBUG ? 0 : info.distance);
    if (!IS_DEBUG) {
      localStorage.setItem('jg_race_best', String(best));
      updateBestLabel();
    }
    const suf = t('score_suffix');
    if (window.ArcadeFX) {
      ArcadeFX.showGameOver({
        lang: LANG,
        title: t('over_title'),
        score: info.distance + suf,
        best: best + suf,
        isNewRecord,
        stats: [
          { label: t('stat_coins'), value: info.coins },
          { label: t('stat_maxspd'), value: info.maxSpeed }
        ],
        onRestart: () => {
          scoreEl.textContent = '0';
          coinsEl.textContent = '0';
          engine.start();
          showBiomeToast('city');
        }
      });
    }
  }
});

document.getElementById('langbar').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  LANG = b.dataset.lang;
  localStorage.setItem('jg_lang', LANG);
  applyUI();
});

laneSelect.addEventListener('change', () => {
  const n = parseInt(laneSelect.value, 10) || 3;
  localStorage.setItem('race-lanes', String(n));
  if (window.ArcadeFX) ArcadeFX.hideGameOver();
  engine.setLanes(n);
  engine.start();
});

document.getElementById('leftButton').addEventListener('click', () => engine.steer(-1));
document.getElementById('rightButton').addEventListener('click', () => engine.steer(1));
nitroBtn.addEventListener('click', () => engine.triggerNitro());

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); engine.steer(-1); }
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); engine.steer(1); }
  else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') { e.preventDefault(); engine.triggerNitro(); }
});

let swipeX = null, swipeY = null;
canvas.addEventListener('pointerdown', e => { swipeX = e.clientX; swipeY = e.clientY; });
canvas.addEventListener('pointerup', e => {
  if (swipeX == null) return;
  const dx = e.clientX - swipeX;
  const dy = e.clientY - swipeY;
  swipeX = null; swipeY = null;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 22) {
    engine.steer(dx > 0 ? 1 : -1);
  } else if (dy < -28) {
    engine.triggerNitro();
  }
});

window.addEventListener('resize', () => engine.resize());
window.addEventListener('pagehide', () => engine.stop(true));
const backLink = document.querySelector('.top-back');
if (backLink) backLink.addEventListener('click', () => engine.stop(true));

if (IS_DEBUG) {
  window.__raceDebug = {
    setSpeed: v => { engine.debugSpeed = Number(v); },
    setBiome: i => { engine.forcedBiome = (i == null ? null : Number(i)); engine.render(); },
    god: v => { engine.godMode = Boolean(v); },
    triggerCrash: () => { engine.triggerCrash(); },
    clear: () => { engine.stop(true); },
    state: () => ({
      distance: Math.floor(engine.distance),
      coins: engine.coins,
      speed: Math.round(engine.speedKmh),
      nitro: Math.round(engine.nitro),
      biome: engine.getBiomeIndex(),
      gameOver: engine.gameOver
    })
  };
}

document.addEventListener('DOMContentLoaded', () => {
  updateBestLabel();
  applyUI();
  engine.start();
  showBiomeToast('city');
});
</script>
</body>
</html>
