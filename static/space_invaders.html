<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title data-i18n="title">Shuttle Cruiser — Lobby.gg</title>
<link rel="icon" type="image/svg+xml" href="/games/static/favicon.svg">
<link rel="stylesheet" href="/games/static/theme.css">
<link rel="stylesheet" href="/games/static/game-ui.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow-x: hidden;
    background: #050916; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;
  }
  nav, footer, .bottom-nav, #tab-bar, .app-tab-bar { display: none !important; }

  #gameCanvas {
    position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; touch-action: none; display: block;
  }

  .screen {
    position: relative; z-index: 10; min-height: 100dvh; max-width: 560px; margin: 0 auto;
    padding: max(8px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom));
    display: none; flex-direction: column; gap: 10px;
  }
  .screen.active { display: flex; }

  .game-topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: nowrap;
  }
  .top-title { font-size: 16px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dust-pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px;
    background: rgba(250, 204, 21, 0.14); border: 1px solid rgba(250, 204, 21, 0.4);
    color: #fde047; font-size: 13px; font-weight: 800; white-space: nowrap;
  }

  .lang-wrap { display: flex; justify-content: center; }
  #langbar {
    display: inline-flex; gap: 4px; padding: 3px; border-radius: 999px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  }
  #langbar button {
    border: none; background: transparent; color: #94a3b8; font-size: 11px; font-weight: 800;
    padding: 5px 9px; border-radius: 999px; cursor: pointer; width: auto;
  }
  #langbar button.active { background: #38bdf8; color: #050916; }

  .tabs {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px;
    background: rgba(15, 23, 42, 0.85); border-radius: 14px; border: 1px solid rgba(255,255,255,0.08);
  }
  .tab-btn {
    border: none; background: transparent; color: #94a3b8; font-weight: 800; font-size: 13px;
    padding: 9px 6px; border-radius: 10px; cursor: pointer; width: 100%;
  }
  .tab-btn.active { background: rgba(56,189,248,0.2); color: #fff; box-shadow: inset 0 0 0 1px rgba(56,189,248,0.45); }

  .panel {
    background: rgba(15, 23, 42, 0.88); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px; padding: 14px; backdrop-filter: blur(10px);
  }
  .gal-card {
    border-radius: 14px; padding: 12px; margin-bottom: 10px;
    background: linear-gradient(135deg, rgba(14, 165, 233, 0.14), rgba(15, 23, 42, 0.9));
    border: 1px solid rgba(56, 189, 248, 0.35);
  }
  .gal-card.locked {
    background: rgba(15, 23, 42, 0.65); border-color: rgba(255,255,255,0.08); opacity: 0.72;
  }
  .gal-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .gal-name { font-size: 16px; font-weight: 900; }
  .gal-badge { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: rgba(56,189,248,0.2); color: #7dd3fc; }
  .gal-desc { font-size: 12px; color: #cbd5e1; line-height: 1.4; margin-bottom: 10px; }

  .sector-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
  .sec-btn {
    padding: 8px 4px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(30, 41, 59, 0.85); color: #f8fafc; font-weight: 800; font-size: 13px;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%;
  }
  .sec-btn.boss { border-color: rgba(244, 63, 94, 0.6); background: rgba(136, 19, 55, 0.45); }
  .sec-btn.sel { box-shadow: 0 0 0 2px #38bdf8; }
  .sec-btn:disabled { opacity: 0.38; cursor: not-allowed; }
  .sec-stars { font-size: 10px; color: #facc15; letter-spacing: -1px; }

  .btn-main {
    width: 100%; padding: 13px 16px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, #0ea5e9, #2563eb); color: #fff;
    font-size: 15px; font-weight: 900; cursor: pointer; box-shadow: 0 8px 22px rgba(14,165,233,0.35);
  }
  .btn-main:active { transform: scale(0.98); }
  .btn-ghost {
    width: 100%; padding: 10px 14px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06);
    color: #e2e8f0; font-size: 13px; font-weight: 800; cursor: pointer;
  }

  /* Hangar */
  .hangar-preview { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  #shipPreviewCanvas { width: 92px; height: 92px; border-radius: 16px; background: rgba(2,6,23,0.85); border: 1px solid rgba(56,189,248,0.3); flex: none; }
  .stat-bars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 10px 0; }
  .stat-item { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 7px 9px; font-size: 12px; }
  .stat-item b { display: block; font-size: 14px; color: #38bdf8; }
  .ship-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
  .ship-chip {
    padding: 8px 6px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(30,41,59,0.7); color: #e2e8f0; font-size: 12px; font-weight: 800; cursor: pointer; width: 100%;
  }
  .ship-chip.on { border-color: #38bdf8; background: rgba(56,189,248,0.2); }
  .ship-chip.locked { opacity: 0.55; }
  .upg-list { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 12px; }
  .upg-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 6px 10px; font-size: 12px; }
  .upg-info { display: flex; flex-direction: column; gap: 1px; }
  .upg-pips { color: #38bdf8; letter-spacing: 2px; font-size: 11px; }
  .upg-pct { color: #94a3b8; font-size: 11px; white-space: nowrap; }
  .upg-btn { padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(250,204,21,0.45); background: rgba(250,204,21,0.14); color: #fde047; font-size: 11px; font-weight: 800; cursor: pointer; white-space: nowrap; }
  .upg-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Play HUD */
  #playHud {
    position: fixed; inset: 0; z-index: 15; pointer-events: none; display: none;
    flex-direction: column; justify-content: space-between;
    padding: max(8px, env(safe-area-inset-top)) 10px max(12px, env(safe-area-inset-bottom));
  }
  #playHud.active { display: flex; }
  .hud-top { display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
  .hud-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .hp-wrap {
    flex: 1; min-width: 110px; height: 16px; background: rgba(15,23,42,0.85); border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18); overflow: hidden; position: relative;
  }
  .hp-fill { height: 100%; background: linear-gradient(90deg, #ef4444, #22c55e); transition: width 0.12s; }
  .hp-txt { position: absolute; inset: 0; font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center; text-shadow: 0 1px 2px #000; }
  .hud-pill {
    padding: 4px 9px; border-radius: 999px; background: rgba(15,23,42,0.88);
    border: 1px solid rgba(255,255,255,0.14); font-size: 12px; font-weight: 800; white-space: nowrap;
  }
  .xp-bar { width: 100%; height: 5px; border-radius: 999px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .xp-fill { height: 100%; background: #34d399; width: 0%; transition: width 0.15s; }
  .hud-meta-row { display: flex; align-items: center; gap: 8px; }
  .wave-pill {
    padding: 2px 8px; border-radius: 999px; background: rgba(15,23,42,0.88);
    border: 1px solid rgba(56,189,248,0.28); font-size: 11px; font-weight: 800; color: #bae6fd; white-space: nowrap;
  }
  .wave-bar { flex: 1; height: 5px; border-radius: 999px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .wave-fill { height: 100%; background: linear-gradient(90deg, #38bdf8, #818cf8); width: 100%; transition: width 0.12s; }
  .boss-hud { display: none; flex-direction: column; gap: 3px; background: rgba(15,23,42,0.86); border: 1px solid rgba(244,63,94,0.45); border-radius: 10px; padding: 4px 8px; }
  .boss-hud.active { display: flex; }
  .boss-hud-top { display: flex; justify-content: space-between; font-size: 11px; font-weight: 900; color: #fda4af; }
  .boss-bar { width: 100%; height: 7px; border-radius: 999px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .boss-fill { height: 100%; background: linear-gradient(90deg, #f43f5e, #fb923c); width: 100%; transition: width 0.1s; }
  .slots-row { display: flex; gap: 4px; flex-wrap: wrap; }
  .slot-badge {
    font-size: 11px; padding: 2px 6px; border-radius: 6px; background: rgba(15,23,42,0.85);
    border: 1px solid rgba(56,189,248,0.35); color: #e2e8f0; font-weight: 700;
  }
  .hud-bottom { display: flex; justify-content: flex-end; align-items: flex-end; pointer-events: none; }
  .ability-btn {
    position: relative; pointer-events: auto; width: 68px; height: 68px; border-radius: 50%; border: 2px solid rgba(56,189,248,0.4);
    background: rgba(14,165,233,0.24); color: #fff; font-size: 11px; font-weight: 900;
    cursor: pointer; backdrop-filter: blur(8px); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; box-shadow: 0 0 18px rgba(56,189,248,0.35);
  }
  .ability-btn:disabled { opacity: 0.72; border-color: rgba(100,116,139,0.5); box-shadow: none; }
  .ab-ring { position: absolute; inset: -3px; width: 70px; height: 70px; transform: rotate(-90deg); pointer-events: none; }
  .ab-ring circle { fill: none; stroke-width: 3.5; }
  .ab-ring .ab-track { stroke: rgba(255,255,255,0.12); }
  .ab-ring .ab-prog { stroke: #38bdf8; stroke-linecap: round; transition: stroke-dashoffset 0.08s linear; }

  /* Modals */
  .modal {
    position: fixed; inset: 0; z-index: 50; background: rgba(2,6,23,0.82); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; padding: 14px;
  }
  .modal.open { display: flex; }
  .modal-box {
    width: 100%; max-width: 440px; max-height: 90dvh; overflow-y: auto;
    background: #0f172a; border: 1px solid rgba(255,255,255,0.14); border-radius: 20px; padding: 16px;
  }
  .card-list { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
  .up-card {
    text-align: left; width: 100%; padding: 11px 12px; border-radius: 14px; cursor: pointer;
    background: rgba(30,41,59,0.9); color: #f8fafc; border: 2px solid #64748b;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .up-card.common { border-color: #94a3b8; }
  .up-card.rare { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56,189,248,0.2); }
  .up-card.epic { border-color: #c084fc; box-shadow: 0 0 14px rgba(192,132,252,0.25); }
  .up-card.legendary { border-color: #facc15; box-shadow: 0 0 16px rgba(250,204,21,0.3); }
  .up-ico { font-size: 24px; line-height: 1; }
  .up-meta { flex: 1; min-width: 0; }
  .up-title { font-size: 14px; font-weight: 900; display: flex; justify-content: space-between; gap: 6px; }
  .up-desc { font-size: 12px; color: #cbd5e1; margin-top: 3px; }
  .up-syn { font-size: 11px; color: #fde047; margin-top: 3px; }

  .lb-row { display: flex; justify-content: space-between; padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 13px; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<main id="menuScreen" class="screen active">
  <header class="game-topbar">
    <a href="/games" class="back-btn" data-i18n="back_games">‹ Игры</a>
    <div class="top-title">🚀 Shuttle Cruiser</div>
    <div class="dust-pill">✨ <span id="dustVal">0</span></div>
  </header>

  <div class="lang-wrap">
    <div id="langbar">
      <button type="button" data-lang="uk">УКР</button>
      <button type="button" data-lang="ru" class="active">РУС</button>
      <button type="button" data-lang="en">ENG</button>
      <button type="button" data-lang="de">DEU</button>
    </div>
  </div>

  <div class="tabs">
    <button type="button" class="tab-btn active" data-tab="galaxies" data-i18n="tab_galaxies">Галактики</button>
    <button type="button" class="tab-btn" data-tab="hangar" data-i18n="tab_hangar">Ангар</button>
    <button type="button" class="tab-btn" data-tab="records" data-i18n="tab_records">Рекорды</button>
  </div>

  <section id="tabGalaxies" class="panel">
    <div id="galList"></div>
    <button id="startRunBtn" type="button" class="btn-main" data-i18n="start_btn">▶ Начать забег</button>
  </section>

  <section id="tabHangar" class="panel" style="display:none">
    <div class="ship-list" id="shipList"></div>
    <div class="hangar-preview">
      <canvas id="shipPreviewCanvas" width="92" height="92"></canvas>
      <div>
        <div id="shipName" style="font-size:18px;font-weight:900">Искра</div>
        <div id="shipAbName" style="font-size:12px;color:#38bdf8;font-weight:800;margin-top:2px"></div>
        <div id="shipAbDesc" style="font-size:12px;color:#cbd5e1;margin-top:4px"></div>
      </div>
    </div>
    <div class="stat-bars" id="shipStats"></div>
    <div class="upg-list" id="shipUpgrades"></div>
    <button id="shipActionBtn" type="button" class="btn-main"></button>
  </section>

  <section id="tabRecords" class="panel" style="display:none">
    <div style="font-size:15px;font-weight:900;margin-bottom:8px" data-i18n="lb_title">🏆 Рекорды Shuttle Cruiser</div>
    <div id="lbList" style="font-size:13px;color:#94a3b8">...</div>
  </section>
</main>

<div id="playHud">
  <div class="hud-top">
    <div class="hud-row">
      <div class="hp-wrap">
        <div class="hp-fill" id="hpFill" style="width:100%"></div>
        <div class="hp-txt" id="hpTxt">100/100</div>
      </div>
      <div class="hud-pill" id="hudSector">1-1</div>
      <div class="hud-pill" id="hudLvl">Lv.1</div>
      <button type="button" class="hud-pill" id="pauseBtn" style="cursor:pointer;color:#fff;width:auto;flex:none;padding:4px 10px">⏸</button>
    </div>
    <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
    <div class="hud-meta-row">
      <div class="wave-pill" id="hudWave">Волна 1/3</div>
      <div class="wave-bar"><div class="wave-fill" id="waveProgFill"></div></div>
    </div>
    <div class="boss-hud" id="bossHud">
      <div class="boss-hud-top"><span id="bossName">BOSS</span><span id="bossHpPct">100%</span></div>
      <div class="boss-bar"><div class="boss-fill" id="bossHpFill"></div></div>
    </div>
    <div class="slots-row" id="slotsRow"></div>
  </div>
  <div class="hud-bottom">
    <button type="button" class="ability-btn" id="abilityBtn">
      <svg class="ab-ring" viewBox="0 0 70 70"><circle class="ab-track" cx="35" cy="35" r="32"/><circle class="ab-prog" id="abRingProg" cx="35" cy="35" r="32" stroke-dasharray="201.06" stroke-dashoffset="0"/></svg>
      <span id="abIcon">⚡</span>
      <span id="abCdTxt" data-i18n="ab_ready">ГОТОВО</span>
    </button>
  </div>
</div>

<!-- Level Up 3-Card Modal -->
<div class="modal" id="cardModal">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:18px;font-weight:900" data-i18n="pick_card">Выбери улучшение</div>
      <button type="button" class="btn-ghost" id="rerollBtn" style="width:auto;padding:6px 10px">🔄 1</button>
    </div>
    <div class="card-list" id="cardChoices"></div>
  </div>
</div>

<!-- Sector Clear Modal -->
<div class="modal" id="sectorModal">
  <div class="modal-box" style="text-align:center">
    <div style="font-size:22px;font-weight:900" id="secTitle">Сектор зачищен!</div>
    <div style="font-size:26px;margin:8px 0;color:#facc15" id="secStars">★★★</div>
    <div style="font-size:14px;color:#cbd5e1;margin-bottom:14px" id="secStats"></div>
    <div id="secUnlock" style="display:none;font-size:13px;color:#a7f3d0;margin:-4px 0 14px;line-height:1.5;background:rgba(16,185,129,0.12);border:1px solid rgba(52,211,153,0.3);border-radius:10px;padding:8px 10px"></div>
    <button type="button" class="btn-main" id="nextSectorBtn" data-i18n="next_sector">Дальше →</button>
    <button type="button" class="btn-ghost" id="backMapBtn" style="margin-top:8px" data-i18n="to_map">На карту галактик</button>
  </div>
</div>

<!-- Game Over / Victory Modal -->
<div class="modal" id="endModal">
  <div class="modal-box" style="text-align:center">
    <div style="font-size:22px;font-weight:900" id="endTitle">Корабль уничтожен</div>
    <div style="font-size:14px;color:#cbd5e1;margin:10px 0 14px" id="endStats"></div>
    <button type="button" class="btn-main" id="endBackBtn" data-i18n="to_map">На карту галактик</button>
  </div>
</div>

<!-- Pause Modal -->
<div class="modal" id="pauseModal">
  <div class="modal-box" style="text-align:center">
    <div style="font-size:20px;font-weight:900;margin-bottom:14px" data-i18n="pause_title">Пауза</div>
    <button type="button" class="btn-main" id="resumeBtn" data-i18n="resume_btn">Продолжить</button>
    <button type="button" class="btn-ghost" id="quitBtn" style="margin-top:8px" data-i18n="to_map">На карту галактик</button>
  </div>
</div>

<script src="/games/static/ui.js"></script>
<script src="/games/static/sfx.js"></script>
<script src="/games/static/shuttle/data.js"></script>
<script src="/games/static/shuttle/save.js"></script>
<script src="/games/static/shuttle/sprites.js"></script>
<script src="/games/static/shuttle/engine.js"></script>

let LANG = localStorage.getItem('jg_lang') || 'ru';
if (!UI[LANG]) LANG = 'ru';
const t = k => (UI[LANG] && UI[LANG][k]) || UI.ru[k] || k;
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

const DATA = window.SHUTTLE_DATA;
const SAVE = window.SHUTTLE_SAVE;
let saveState = SAVE.loadLocal();
let selectedGalaxy = 1;
let selectedSector = 1;
let previewShipId = saveState.selected_ship || 'spark';
let engine = null;

function applyUI() {
  window.SHUTTLE_LANG = LANG;
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('#langbar button').forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
  renderGalaxies();
  renderHangar();
}

function renderGalaxies() {
  document.getElementById('dustVal').textContent = saveState.dust || 0;
  const maxGal = saveState.max_galaxy || 1;
  const wrap = document.getElementById('galList');
  wrap.innerHTML = DATA.GALAXIES.map(g => {
    const galUnlocked = g.id <= maxGal;
    if (!galUnlocked) {
      const hint = t('unlock_gal_boss').replace('{n}', g.id - 1);
      return `<div class="gal-card locked">
        <div class="gal-head"><span class="gal-name">🔒 ${g.id}. ${g.name[LANG]}</span><span class="gal-badge">${t('gal_locked')}</span></div>
        <div class="gal-desc">${g.desc[LANG]}</div>
        <div style="font-size:12px;color:#fbbf24;margin-top:6px;font-weight:700">🔓 ${hint}</div>
      </div>`;
    }
    const maxSec = g.id < maxGal ? 10 : (saveState.max_sector || 1);
    let secs = '<div class="sector-grid">';
    for (let s = 1; s <= g.sectors; s++) {
      const unlocked = s <= maxSec;
      const st = saveState.stars[`${g.id}-${s}`] || 0;
      const starsStr = st > 0 ? '★'.repeat(st) + '☆'.repeat(3 - st) : (s === 5 || s === 10 ? '☠' : '•');
      const isSel = g.id === selectedGalaxy && s === selectedSector;
      const cls = ['sec-btn', (s === 5 || s === 10) ? 'boss' : '', isSel ? 'sel' : ''].join(' ');
      secs += `<button type="button" class="${cls}" ${unlocked ? '' : 'disabled'} data-gal="${g.id}" data-sec="${s}"><span>${s}</span><span class="sec-stars">${starsStr}</span></button>`;
    }
    secs += '</div>';
    return `<div class="gal-card">
      <div class="gal-head"><span class="gal-name">🌌 ${g.id}. ${g.name[LANG]}</span><span class="gal-badge">${t('unlocked_lbl')}</span></div>
      <div class="gal-desc">${g.desc[LANG]}</div>
      ${secs}
    </div>`;
  }).join('');

  wrap.querySelectorAll('[data-sec]').forEach(b => {
    b.onclick = () => {
      selectedGalaxy = Number(b.dataset.gal);
      selectedSector = Number(b.dataset.sec);
      renderGalaxies();
    };
  });
}

function renderHangar() {
  const shipList = document.getElementById('shipList');
  shipList.innerHTML = DATA.SHIPS.map(s => {
    const owned = saveState.ships.includes(s.id);
    const cls = ['ship-chip', previewShipId === s.id ? 'on' : '', (!s.playable || !owned) ? 'locked' : ''].join(' ');
    return `<button type="button" class="${cls}" data-ship="${s.id}">${owned ? '' : '🔒 '}${s.name[LANG]}</button>`;
  }).join('');
  shipList.querySelectorAll('[data-ship]').forEach(b => {
    b.onclick = () => { previewShipId = b.dataset.ship; renderHangar(); };
  });

  const s = DATA.SHIPS.find(x => x.id === previewShipId) || DATA.SHIPS[0];
  const ups = (saveState.ship_upgrades && saveState.ship_upgrades[s.id]) || {};
  const st = DATA.getShipStats ? DATA.getShipStats(s, ups) : s;
  document.getElementById('shipName').textContent = s.name[LANG];
  document.getElementById('shipAbName').textContent = s.abilityName[LANG];
  document.getElementById('shipAbDesc').textContent = s.abilityDesc[LANG];
  document.getElementById('shipStats').innerHTML = `
    <div class="stat-item">${t('stat_hp')}<b>${st.hp}</b></div>
    <div class="stat-item">${t('stat_spd')}<b>${st.speed}</b></div>
    <div class="stat-item">${t('stat_dmg')}<b>${st.dmg}</b></div>
    <div class="stat-item">${t('stat_crit')}<b>${Math.round(st.crit * 100)}%</b></div>
    <div class="stat-item">${t('stat_rate')}<b>${st.fireRate.toFixed(1)}/s</b></div>`;

  const owned = saveState.ships.includes(s.id);
  const upgBox = document.getElementById('shipUpgrades');
  if (owned && DATA.UPGRADE_COSTS) {
    const rows = [
      { key: 'hp', label: t('upg_hp'), lvl: st.hpLvl || 0, pct: 12 },
      { key: 'dmg', label: t('upg_dmg'), lvl: st.dmgLvl || 0, pct: 10 },
      { key: 'rate', label: t('upg_rate'), lvl: st.rateLvl || 0, pct: 8 }
    ];
    upgBox.innerHTML = rows.map(r => {
      const pips = '■'.repeat(r.lvl) + '□'.repeat(5 - r.lvl);
      const cost = r.lvl < 5 ? DATA.UPGRADE_COSTS[r.lvl] : 0;
      const canBuy = r.lvl < 5 && (saveState.dust || 0) >= cost;
      const btnTxt = r.lvl >= 5 ? t('upg_max') : `✨ ${cost}`;
      return `<div class="upg-row">
        <div class="upg-info"><span>${r.label}</span><span class="upg-pips">${pips}</span><span class="upg-pct">+${r.pct * r.lvl}%${r.lvl < 5 ? ` → +${r.pct * (r.lvl + 1)}%` : ''}</span></div>
        <button type="button" class="upg-btn" data-upg="${r.key}" ${canBuy ? '' : 'disabled'}>${btnTxt}</button>
      </div>`;
    }).join('');
    upgBox.querySelectorAll('[data-upg]').forEach(b => {
      b.onclick = () => {
        const k = b.dataset.upg;
        const curMap = (saveState.ship_upgrades && saveState.ship_upgrades[s.id]) || {};
        const lvl = curMap[k] || 0;
        if (lvl >= 5) return;
        const cost = DATA.UPGRADE_COSTS[lvl];
        if ((saveState.dust || 0) < cost) return;
        saveState.dust -= cost;
        if (!saveState.ship_upgrades) saveState.ship_upgrades = {};
        if (!saveState.ship_upgrades[s.id]) saveState.ship_upgrades[s.id] = {};
        saveState.ship_upgrades[s.id][k] = lvl + 1;
        SAVE.pushCloud(saveState);
        renderGalaxies();
        renderHangar();
      };
    });
  } else {
    const g = s.unlockGalaxy || 1;
    const key = s.unlockSector === 5 ? 'unlock_ship_mini' : 'unlock_ship_boss';
    upgBox.innerHTML = s.unlockSector ? `<div style="font-size:12px;color:#fbbf24;font-weight:700;margin-bottom:8px">🔓 ${t(key).replace('{g}', g).replace('{c}', s.cost)}</div>` : '';
  }

  const btn = document.getElementById('shipActionBtn');
  if (!s.playable) {
    btn.textContent = t('locked_6b');
    btn.disabled = true;
  } else if (owned) {
    btn.disabled = false;
    btn.textContent = t('select_ship');   // купленный корабль: «▶ В бой» (клик выбирает и запускает)
    btn.onclick = () => {
      saveState.selected_ship = s.id;
      SAVE.pushCloud(saveState);
      launchGame(selectedGalaxy, selectedSector, selectedSector > 1);
    };
  } else {
    btn.textContent = `${t('buy_ship')}${s.cost}`;
    btn.disabled = (saveState.dust || 0) < s.cost;
    btn.onclick = () => {
      if ((saveState.dust || 0) < s.cost) return;
      saveState.dust -= s.cost;
      saveState.ships.push(s.id);
      saveState.selected_ship = s.id;
      SAVE.pushCloud(saveState);
      renderGalaxies();
      renderHangar();
    };
  }
}

let previewAngle = 0;
function drawShipPreview() {
  const c = document.getElementById('shipPreviewCanvas');
  if (!c) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if (c.width !== Math.round(92 * dpr)) {
    c.width = Math.round(92 * dpr);
    c.height = Math.round(92 * dpr);
  }
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const s = DATA.SHIPS.find(x => x.id === previewShipId) || DATA.SHIPS[0];
  ctx.clearRect(0, 0, 92, 92);
  previewAngle += 0.035;
  const bobY = Math.sin(previewAngle * 1.4) * 2.5;
  const bank = Math.sin(previewAngle) * 0.22;
  ctx.save();
  ctx.translate(46, 46 + bobY);
  ctx.rotate(bank);
  ctx.scale(1.42, 1.42);
  if (window.SHUTTLE_SPRITES) {
    window.SHUTTLE_SPRITES.renderShipToCtx(ctx, s.id);
  }
  ctx.restore();
  requestAnimationFrame(drawShipPreview);
}

function updatePlayHud() {
  if (!engine) return;
  const hudTop = document.querySelector('#playHud .hud-top');
  if (hudTop) engine.setHudTop(hudTop.getBoundingClientRect().bottom + 6);

  const hpPct = Math.max(0, Math.min(100, (engine.hp / Math.max(1, engine.maxHp)) * 100));
  document.getElementById('hpFill').style.width = `${hpPct}%`;
  document.getElementById('hpTxt').textContent = `${Math.ceil(engine.hp)}/${engine.maxHp}`;
  document.getElementById('hudSector').textContent = `${engine.galaxyId}-${engine.sector}`;
  document.getElementById('hudLvl').textContent = `Lv.${engine.level}`;
  document.getElementById('xpFill').style.width = `${Math.min(100, (engine.xp / engine.xpNext) * 100)}%`;

  document.getElementById('hudWave').textContent = `${t('wave_lbl')} ${engine.wave}/${engine.maxWaves}`;
  const remPct = engine.boss
    ? Math.max(0, Math.min(100, (engine.boss.hp / Math.max(1, engine.boss.maxHp)) * 100))
    : Math.max(0, Math.min(100, (engine.enemies.length / Math.max(1, engine.waveTotalEnemies || 1)) * 100));
  document.getElementById('waveProgFill').style.width = `${remPct}%`;

  const bossHud = document.getElementById('bossHud');
  if (engine.boss) {
    bossHud.classList.add('active');
    const bPct = Math.max(0, Math.min(100, (engine.boss.hp / Math.max(1, engine.boss.maxHp)) * 100));
    const gal = DATA.GALAXIES.find(g => g.id === engine.galaxyId) || DATA.GALAXIES[0];
    const bTitle = engine.boss.isFinal
      ? (gal.bossFinal?.[LANG] || t('boss_titan'))
      : (gal.bossMini?.[LANG] || t('boss_reaper'));
    document.getElementById('bossName').textContent = `⚠ ${bTitle}`;
    document.getElementById('bossHpPct').textContent = `${Math.ceil(bPct)}%`;
    document.getElementById('bossHpFill').style.width = `${bPct}%`;
  } else {
    bossHud.classList.remove('active');
  }

  const slots = Object.entries(engine.cards).map(([id, lvl]) => {
    const c = DATA.CARDS.find(x => x.id === id);
    return `<span class="slot-badge">${c ? c.icon : ''} ${'I'.repeat(lvl)}</span>`;
  });
  for (const eid of engine.evolutions) {
    const ev = DATA.EVOLUTIONS.find(x => x.id === eid);
    if (ev) slots.push(`<span class="slot-badge" style="border-color:#facc15">${ev.icon}</span>`);
  }
  document.getElementById('slotsRow').innerHTML = slots.join('');

  const abBtn = document.getElementById('abilityBtn');
  abBtn.disabled = engine.abilityCd > 0;
  document.getElementById('abCdTxt').textContent = engine.abilityCd > 0 ? `${engine.abilityCd.toFixed(1)}s` : t('ab_ready');
  const ring = document.getElementById('abRingProg');
  if (ring) {
    const circ = 201.06;
    const ratio = engine.abilityMaxCd > 0 ? Math.max(0, Math.min(1, engine.abilityCd / engine.abilityMaxCd)) : 0;
    ring.style.strokeDashoffset = (circ * ratio).toFixed(2);
    ring.style.stroke = engine.abilityCd > 0 ? '#64748b' : '#38bdf8';
  }
}

function showCardChoices(choices, rerolls) {
  const box = document.getElementById('cardChoices');
  const rr = document.getElementById('rerollBtn');
  rr.textContent = `🔄 ${rerolls}`;
  rr.disabled = rerolls <= 0;
  box.innerHTML = choices.map(c => {
    const desc = Array.isArray(c.desc[LANG]) ? c.desc[LANG][(c.nextLvl || 1) - 1] : c.desc[LANG];
    const lvlStr = c.isEvolution ? 'EVO' : 'I'.repeat(c.nextLvl || 1);
    let synHtml = '';
    if (c.synergy) {
      const pair = DATA.CARDS.find(x => x.id === c.synergy);
      if (pair) synHtml = `<div class="up-syn">🔗 ${t('syn_hint')}${pair.icon} ${pair.name[LANG]}</div>`;
    }
    return `<button type="button" class="up-card ${c.rarity}" data-cid="${c.id}">
      <div class="up-ico">${c.icon}</div>
      <div class="up-meta">
        <div class="up-title"><span>${c.name[LANG]}</span><span>${lvlStr}</span></div>
        <div class="up-desc">${desc}</div>
        ${synHtml}
      </div>
    </button>`;
  }).join('');
  box.querySelectorAll('[data-cid]').forEach(b => {
    b.onclick = () => {
      document.getElementById('cardModal').classList.remove('open');
      engine.addCard(b.dataset.cid);
    };
  });
  document.getElementById('cardModal').classList.add('open');
}

function launchGame(gal, sec, singleSector) {
  document.getElementById('menuScreen').classList.remove('active');
  document.getElementById('playHud').classList.add('active');
  const shipId = saveState.selected_ship || 'spark';
  const upgrades = (saveState.ship_upgrades && saveState.ship_upgrades[shipId]) || {};
  engine.startRun({ shipId, upgrades, galaxyId: gal, startSector: sec, singleSector });
}

function exitToMenu() {
  engine.stop();
  // иначе последний кадр боя (босс, цифры урона) просвечивает сквозь полупрозрачное меню
  const cv = document.getElementById('gameCanvas'), cx = cv.getContext('2d');
  cx.save(); cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, cv.width, cv.height); cx.restore();
  document.querySelectorAll('.modal').forEach(m => m.classList.remove('open'));
  document.getElementById('playHud').classList.remove('active');
  document.getElementById('menuScreen').classList.add('active');
  renderGalaxies();
  renderHangar();
}

document.addEventListener('DOMContentLoaded', async () => {
  const canvas = document.getElementById('gameCanvas');
  engine = new window.ShuttleEngine(canvas, {
    onHudUpdate: updatePlayHud,
    onLevelUp: (choices, rerolls) => showCardChoices(choices, rerolls),
    onPauseChange: paused => document.getElementById('pauseModal').classList.toggle('open', paused),
    onSectorClear: info => {
      const key = `${info.galaxy}-${info.sector}`;
      saveState.stars[key] = Math.max(saveState.stars[key] || 0, info.stars);
      const prevMaxGal = saveState.max_galaxy || 1;
      if (info.galaxy >= prevMaxGal) {
        if (info.sector >= 10 && prevMaxGal < 5) {
          saveState.max_galaxy = info.galaxy + 1;
          saveState.max_sector = 1;
        } else {
          saveState.max_sector = Math.min(10, Math.max(saveState.max_sector || 1, info.sector + 1));
        }
      }
      saveState.dust = (saveState.dust || 0) + info.dust;
      saveState.best_score = Math.max(saveState.best_score || 0, info.score);
      const unlockedShips = [];
      const tryUnlockShip = id => {
        if (!saveState.ships.includes(id)) {
          saveState.ships.push(id);
          unlockedShips.push(id);
        }
      };
      if (info.galaxy === 1 && info.sector >= 5) tryUnlockShip('bastion');
      if (info.galaxy === 2 && info.sector >= 10) tryUnlockShip('sting');
      if (info.galaxy === 3 && info.sector >= 10) tryUnlockShip('hive');
      if (info.galaxy === 4 && info.sector >= 10) tryUnlockShip('phantom');
      if (info.galaxy === 5 && info.sector >= 5) tryUnlockShip('nova');
      SAVE.pushCloud(saveState);

      const gal = DATA.GALAXIES.find(g => g.id === info.galaxy) || DATA.GALAXIES[0];
      document.getElementById('secTitle').textContent = info.sector >= 10 ? t('gal_cleared') : t('sec_cleared');
      document.getElementById('secStars').textContent = '★'.repeat(info.stars) + '☆'.repeat(3 - info.stars);
      document.getElementById('secStats').textContent = `${t('score_lbl')}: ${info.score} · +✨ ${info.dust}`;
      const unlockLines = [];
      if (info.sector >= 10 && gal.bossFinal) {
        unlockLines.push(`☠️ ${t('boss_victory_name').replace('{name}', gal.bossFinal[LANG] || gal.bossFinal.ru)}`);
      }
      if ((saveState.max_galaxy || 1) > prevMaxGal) {
        const nextGal = DATA.GALAXIES.find(g => g.id === saveState.max_galaxy);
        if (nextGal) {
          unlockLines.push(`🌌 ${t('boss_victory_gal').replace('{n}', nextGal.id).replace('{name}', nextGal.name[LANG] || nextGal.name.ru)}`);
        }
      }
      for (const sid of unlockedShips) {
        const sh = DATA.SHIPS.find(x => x.id === sid);
        if (sh) unlockLines.push(`🚀 ${t('boss_victory_ship').replace('{name}', sh.name[LANG] || sh.name.ru)}`);
      }
      const secUnlockEl = document.getElementById('secUnlock');
      secUnlockEl.innerHTML = unlockLines.map(l => `<div>${esc(l)}</div>`).join('');
      secUnlockEl.style.display = unlockLines.length ? 'block' : 'none';
      document.getElementById('nextSectorBtn').style.display = info.galaxyDone ? 'none' : 'block';
      document.getElementById('sectorModal').classList.add('open');
    },
    onGameOver: info => {
      saveState.dust = (saveState.dust || 0) + info.dust;
      saveState.best_score = Math.max(saveState.best_score || 0, info.score);
      SAVE.pushCloud(saveState);
      document.getElementById('endTitle').textContent = t('ship_lost');
      document.getElementById('endStats').textContent = `${t('sector_lbl')} ${info.galaxy || 1}-${info.sector} · ${t('score_lbl')}: ${info.score} · +✨ ${info.dust}`;
      document.getElementById('endModal').classList.add('open');
    }
  });

  if (location.search.includes('debug=1')) {
    window.__shuttleDebug = {
      setGod: v => { engine.godMode = Boolean(v); },
      jumpSector: s => { engine._bossSpawnedForSector = false; engine._startSector(s); },
      jumpGalaxySector: (g, s) => {
        engine.galaxyId = g;
        engine._rebuildGradients();
        engine._bossSpawnedForSector = false;
        engine._startSector(s);
      },
      giveCard: id => engine.addCard(id),
      levelUp: () => engine._triggerCardPick(),
      clearEnemies: () => { engine.enemies.length = 0; engine.boss = null; }
    };
  }

  document.getElementById('langbar').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    LANG = b.dataset.lang;
    localStorage.setItem('jg_lang', LANG);
    applyUI();
  });

  document.querySelectorAll('.tab-btn').forEach(b => {
    b.onclick = async () => {
      document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      const tab = b.dataset.tab;
      document.getElementById('tabGalaxies').style.display = tab === 'galaxies' ? 'block' : 'none';
      document.getElementById('tabHangar').style.display = tab === 'hangar' ? 'block' : 'none';
      document.getElementById('tabRecords').style.display = tab === 'records' ? 'block' : 'none';
      if (tab === 'records') {
        const list = await SAVE.fetchLeaderboard();
        document.getElementById('lbList').innerHTML = list.length
          ? list.map((r, i) => `<div class="lb-row"><span>${i + 1}. ${esc(r.username)}</span><span>${r.max_galaxy}-${r.max_sector} · ${r.best_score}</span></div>`).join('')
          : t('no_records');
      }
    };
  });

  document.getElementById('startRunBtn').onclick = () => launchGame(selectedGalaxy, selectedSector, selectedSector > 1);
  document.getElementById('abilityBtn').onclick = () => engine.triggerAbility();
  document.getElementById('pauseBtn').onclick = () => engine.togglePause(true);
  document.getElementById('resumeBtn').onclick = () => engine.togglePause(false);
  document.getElementById('quitBtn').onclick = exitToMenu;
  document.getElementById('backMapBtn').onclick = exitToMenu;
  document.getElementById('endBackBtn').onclick = exitToMenu;
  document.getElementById('nextSectorBtn').onclick = () => {
    document.getElementById('sectorModal').classList.remove('open');
    engine.nextSector();
  };
  document.getElementById('rerollBtn').onclick = () => {
    const ch = engine.rerollCards();
    if (ch.length) showCardChoices(ch, engine.rerolls);
  };

  applyUI();
  drawShipPreview();
  saveState = await SAVE.syncOnBoot();
  applyUI();
});
</script>
</body>
</html>
