<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="page_title">Lobby.gg — 2048</title>
<link rel="icon" type="image/svg+xml" href="/games/static/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/games/static/theme.css">
<link rel="stylesheet" href="/games/static/game-ui.css">
<style>
  *{box-sizing:border-box}
  body{
    display:flex;flex-direction:column;align-items:center;
    height:100vh;height:100dvh;margin:0;
    padding:max(8px,var(--sat)) max(12px,var(--sar)) max(12px,var(--sab)) max(12px,var(--sal));
    -webkit-user-select:none;user-select:none;touch-action:none;overflow:hidden;
    background:#060810;color:var(--text);font-family:'Inter',system-ui,sans-serif;
  }
  .game-topbar{max-width:420px;margin-bottom:4px;flex:none}
  .langbar{display:flex;gap:4px;justify-content:center;margin:2px auto 6px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:999px;padding:4px;width:max-content;flex:none}
  .langbar button{width:auto;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:800;font-size:12px;padding:4px 11px;border-radius:999px;cursor:pointer;letter-spacing:.5px}
  .langbar button.active{background:var(--crimson-deep);color:#fff;box-shadow:0 0 14px rgba(255,34,56,.4)}
  .bar{display:flex;gap:8px;width:100%;max-width:400px;justify-content:space-between;align-items:center;margin:4px 0 8px;flex:none}
  .score{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:12px;padding:6px 14px;text-align:center;min-width:74px}
  .score .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:800}
  .score .v{font-size:18px;font-weight:900;line-height:1.15}
  button.sec{width:auto;padding:9px 16px;margin:0;border-radius:12px;font-weight:800}
  .board{
    position:relative;
    background:linear-gradient(160deg,rgba(22,26,38,.95),rgba(11,14,22,.98));
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;padding:8px;touch-action:none;
    box-shadow:0 18px 46px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.08);
    flex:none;
  }
  .cellbg{
    position:absolute;left:0;top:0;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.035);
    border-radius:10px;pointer-events:none;
  }
  .tile{
    position:absolute;left:0;top:0;z-index:2;
    pointer-events:none;will-change:transform;
  }
  @media (prefers-reduced-motion: no-preference){
    .tile{transition:transform .13s cubic-bezier(.2,.9,.3,1)}
    .tile.new .tile-inner{animation:gPop .18s cubic-bezier(.22,1.25,.36,1) both}
    .tile.merged .tile-inner{animation:gBump .2s cubic-bezier(.22,1.3,.36,1) both}
  }
  .tile-inner{
    width:100%;height:100%;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;letter-spacing:-.5px;color:#fff;
    border:1px solid rgba(255,255,255,.18);
    box-shadow:inset 0 2px 2px rgba(255,255,255,.22),inset 0 -3px 6px rgba(0,0,0,.28),0 4px 12px rgba(0,0,0,.35);
    text-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  @keyframes gPop{0%{transform:scale(.35);opacity:.2}100%{transform:scale(1);opacity:1}}
  @keyframes gBump{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
  .hint{color:var(--muted);font-size:12.5px;margin-top:12px;text-align:center;flex:none}
  .backlink{margin-top:10px;color:var(--muted);font-size:13px;text-decoration:none;flex:none}
  @media (max-width:360px){
    .langbar button{font-size:10px;padding:3px 7px}
    .score{padding:5px 10px;min-width:64px}
    .score .v{font-size:16px}
  }
</style>
</head>
<body>
<header class="game-topbar">
  <a href="/games/" class="top-back" data-i18n-title="nav_games" data-i18n="nav_games">‹ Игры</a>
  <div class="topbar-title" data-i18n="title">🔢 2048</div>
  <button type="button" id="rulesBtn" class="top-icon-btn" data-i18n-title="rules_btn" aria-label="Info">i</button>
</header>

<div id="rulesModal" onclick="if(event.target===this)this.style.display='none'" style="display:none;position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.74);align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)">
  <div style="max-width:380px;width:100%;background:#15151b;border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:20px;text-align:left">
    <div style="font-size:19px;font-weight:800;margin-bottom:10px" data-i18n="rules_title">🔢 2048 — правила</div>
    <div style="font-size:14px;line-height:1.6;color:#d8d8de" data-i18n="rules_body">Свайпай в 4 стороны. Одинаковые плитки при столкновении сливаются в одну (2+2=4). Собери плитку <b>2048</b>. Игра кончается, когда ходов нет.</div>
    <button type="button" id="rulesOk" style="margin-top:16px;width:100%;padding:11px;border-radius:10px;border:none;background:var(--crimson,#e0102e);color:#fff;font-weight:700;cursor:pointer" data-i18n="rules_ok">Понятно 👍</button>
  </div>
</div>

<div class="langbar" id="langbar">
  <button type="button" data-lang="uk">УКР</button>
  <button type="button" data-lang="ru">РУС</button>
  <button type="button" data-lang="en">ENG</button>
  <button type="button" data-lang="de">DEU</button>
</div>

<div class="bar">
  <div class="score"><div class="l" data-i18n="score">Счёт</div><div class="v" id="score">0</div></div>
  <button type="button" class="sec" onclick="newGame()" data-i18n="newbtn">↻ Новая</button>
  <div class="score"><div class="l" data-i18n="best">Рекорд</div><div class="v" id="best">0</div></div>
</div>

<div class="board" id="board"></div>
<div class="hint" data-i18n="hint">Свайпай в 4 стороны. Собери 2048! (на компе — стрелки)</div>
<a class="backlink" href="/games/" data-i18n="all_games">← Все игры</a>

<script src="/games/static/ui.js"></script>
<script src="/games/static/arcade_fx.js"></script>
<script src="/games/static/sfx.js"></script>
<script>
const UI = {
  uk: {
    page_title: "Lobby.gg — 2048",
    rules_btn: "Правила",
    rules_title: "🔢 2048 — правила",
    rules_body: "Свайпай у 4 боки. Однакові плитки при зіткненні зливаються в одну (2+2=4). Збери плитку <b>2048</b>. Гра закінчується, коли ходів немає.",
    rules_ok: "Зрозуміло 👍",
    nav_games: "‹ Ігри",
    title: "🔢 2048",
    score: "Рахунок",
    best: "Рекорд",
    newbtn: "↻ Нова",

    all_games: "← Усі ігри",
    win_title: "🎉 2048 зібрано!",
    win_sub: "Чудова партія!",
    max_tile_lbl: "Макс. плитка"
  },
  ru: {
    page_title: "Lobby.gg — 2048",

    rules_title: "🔢 2048 — правила",
    rules_body: "Свайпай в 4 стороны. Одинаковые плитки при столкновении сливаются в одну (2+2=4). Собери плитку <b>2048</b>. Игра кончается, когда ходов нет.",
    rules_ok: "Понятно 👍",
    nav_games: "‹ Игры",
    title: "🔢 2048",
    score: "Счёт",
    best: "Рекорд",
    newbtn: "↻ Новая",

    all_games: "← Все игры",
    win_title: "🎉 2048 собрано!",
    win_sub: "Отличная партия!",
    max_tile_lbl: "Макс. плитка"
  },
  en: {
    page_title: "Lobby.gg — 2048",
    rules_btn: "Rules",
    rules_title: "🔢 2048 — rules",
    rules_body: "Swipe in 4 directions. Matching tiles merge on contact (2+2=4). Reach the <b>2048</b> tile. Game ends when there are no moves left.",
    rules_ok: "Got it 👍",
    nav_games: "‹ Games",
    title: "🔢 2048",
    score: "Score",
    best: "Best",
    newbtn: "↻ New",
    hint: "Swipe in 4 directions. Reach 2048! (on PC — arrow keys)",
    all_games: "← All games",
    win_title: "🎉 2048 reached!",
    win_sub: "Awesome run!",
    max_tile_lbl: "Top tile"
  },
  de: {
    page_title: "Lobby.gg — 2048",
    rules_btn: "Regeln",
    rules_title: "🔢 2048 — Regeln",
    rules_body: "Wische in 4 Richtungen. Gleiche Kacheln verschmelzen bei Berührung (2+2=4). Erreiche die Kachel <b>2048</b>. Das Spiel endet, wenn keine Züge mehr möglich sind.",
    rules_ok: "Verstanden 👍",
    nav_games: "‹ Spiele",
    title: "🔢 2048",
    score: "Punkte",
    best: "Rekord",
    newbtn: "↻ Neu",
    hint: "Wische in 4 Richtungen. Erreiche 2048! (auf PC — Pfeiltasten)",
    all_games: "← Alle Spiele",
    win_title: "🎉 2048 geschafft!",
    win_sub: "Starke Runde!",
    max_tile_lbl: "Höchste Kachel"
  }
};

let LANG = localStorage.getItem('jg_lang');
if (!UI[LANG]) LANG = 'ru';
function t(k) { const v = UI[LANG] && UI[LANG][k]; return v !== undefined ? v : (UI.ru[k] || k); }

function applyUI() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t(el.dataset.i18n);
    if (typeof v !== 'string') return;
    if (el.dataset.i18n === 'rules_body') el.innerHTML = v;
    else if (el.tagName.toLowerCase() === 'title') document.title = v;
    else el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    const v = t(el.dataset.i18nTitle);
    if (typeof v === 'string') el.title = v;
  });
  document.querySelectorAll('#langbar button').forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
  if (window.ArcadeFX) ArcadeFX.refreshI18n(LANG);
}

document.getElementById('langbar').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  LANG = b.dataset.lang;
  localStorage.setItem('jg_lang', LANG);
  applyUI();
});
document.getElementById('rulesBtn').onclick = () => document.getElementById('rulesModal').style.display = 'flex';
document.getElementById('rulesOk').onclick = () => document.getElementById('rulesModal').style.display = 'none';

const N = 4;
const PALETTE = {
  2:    { bg: 'linear-gradient(155deg,#2b3040,#1c202c)', color: '#e2e8f0', border: 'rgba(148,163,184,.25)', glow: 'none' },
  4:    { bg: 'linear-gradient(155deg,#384157,#262d3d)', color: '#f8fafc', border: 'rgba(148,163,184,.36)', glow: 'none' },
  8:    { bg: 'linear-gradient(155deg,#f59e0b,#b45309)', color: '#fff',    border: 'rgba(253,224,71,.4)',  glow: '0 4px 14px rgba(245,158,11,.28)' },
  16:   { bg: 'linear-gradient(155deg,#fb923c,#c2410c)', color: '#fff',    border: 'rgba(254,215,170,.4)', glow: '0 4px 16px rgba(249,115,22,.32)' },
  32:   { bg: 'linear-gradient(155deg,#fb7185,#e11d48)', color: '#fff',    border: 'rgba(254,205,211,.4)', glow: '0 4px 18px rgba(244,63,94,.36)' },
  64:   { bg: 'linear-gradient(155deg,#ff2238,#9f1239)', color: '#fff',    border: 'rgba(255,138,151,.5)', glow: '0 0 20px rgba(255,34,56,.45)' },
  128:  { bg: 'linear-gradient(155deg,#facc15,#ca8a04)', color: '#111827', border: 'rgba(254,240,138,.8)', glow: '0 0 22px rgba(250,204,21,.52)' },
  256:  { bg: 'linear-gradient(155deg,#34d399,#059669)', color: '#fff',    border: 'rgba(167,243,208,.7)', glow: '0 0 24px rgba(16,185,129,.55)' },
  512:  { bg: 'linear-gradient(155deg,#38bdf8,#0284c7)', color: '#fff',    border: 'rgba(186,230,253,.7)', glow: '0 0 26px rgba(56,189,248,.58)' },
  1024: { bg: 'linear-gradient(155deg,#a78bfa,#6d28d9)', color: '#fff',    border: 'rgba(221,214,254,.8)', glow: '0 0 28px rgba(139,92,246,.62)' },
  2048: { bg: 'linear-gradient(145deg,#fde047,#f97316,#ef4444)', color: '#fff', border: 'rgba(255,255,255,.9)', glow: '0 0 34px rgba(250,204,21,.8)' },
  4096: { bg: 'linear-gradient(145deg,#f472b6,#9333ea,#3b82f6)', color: '#fff', border: 'rgba(255,255,255,.9)', glow: '0 0 36px rgba(236,72,153,.8)' }
};

let grid = [];
let tileNodes = new Map();
let dyingTimer = 0;
let pendingMergeFinalizer = null;
let nextId = 1;
let score = 0, best = +(localStorage.getItem('g2048_best') || 0), runStartBest = best;
let size = 340, gap = 8, cell = 75, won = false, over = false;

document.getElementById('best').textContent = best;

function tileXY(x, y) {
  return { px: gap + x * (cell + gap), py: gap + y * (cell + gap) };
}

function styleTileNode(el, tile, animClass) {
  const p = PALETTE[tile.val] || PALETTE[4096];
  const inner = el.firstElementChild;
  el.style.width = cell + 'px';
  el.style.height = cell + 'px';
  const pos = tileXY(tile.x, tile.y);
  el.style.transform = `translate3d(${pos.px}px, ${pos.py}px, 0)`;
  inner.style.background = p.bg;
  inner.style.color = p.color;
  inner.style.borderColor = p.border;
  inner.style.boxShadow = `inset 0 2px 2px rgba(255,255,255,.22),inset 0 -3px 6px rgba(0,0,0,.28)${p.glow !== 'none' ? ', ' + p.glow : ''}`;
  inner.style.fontSize = (tile.val < 100 ? cell * 0.43 : tile.val < 1000 ? cell * 0.34 : cell * 0.27) + 'px';
  inner.textContent = tile.val;
  el.className = 'tile' + (animClass ? ' ' + animClass : '');
}

function createTileNode(tile, animClass) {
  const el = document.createElement('div');
  const inner = document.createElement('div');
  inner.className = 'tile-inner';
  el.appendChild(inner);
  styleTileNode(el, tile, animClass);
  document.getElementById('board').appendChild(el);
  tileNodes.set(tile.id, el);
  return el;
}

function clearAllTileDOM() {
  clearTimeout(dyingTimer);
  dyingTimer = 0;
  pendingMergeFinalizer = null;
  tileNodes.clear();
  const b = document.getElementById('board');
  b.querySelectorAll('.tile').forEach(e => e.remove());
}

function layout() {
  const b = document.getElementById('board');
  const W = Math.min(window.innerWidth - 24, 400, window.innerHeight * 0.56);
  size = Math.max(220, Math.floor(W));
  cell = Math.floor((size - gap * (N + 1)) / N);
  size = gap * (N + 1) + cell * N;
  b.style.width = size + 'px';
  b.style.height = size + 'px';
  b.querySelectorAll('.cellbg').forEach(e => e.remove());
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const c = document.createElement('div');
      c.className = 'cellbg';
      const pos = tileXY(x, y);
      c.style.width = cell + 'px';
      c.style.height = cell + 'px';
      c.style.transform = `translate3d(${pos.px}px, ${pos.py}px, 0)`;
      b.appendChild(c);
    }
  }
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const tile = grid[y] && grid[y][x];
      if (!tile) continue;
      const el = tileNodes.get(tile.id);
      if (el) styleTileNode(el, tile, '');
    }
  }
}

function newGame() {
  if (window.ArcadeFX) ArcadeFX.hideGameOver();
  clearAllTileDOM();
  grid = Array.from({ length: N }, () => Array(N).fill(null));
  score = 0;
  won = false;
  over = false;
  runStartBest = best;
  document.getElementById('score').textContent = '0';
  spawnTile();
  spawnTile();
}

function spawnTile() {
  const empty = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!grid[y][x]) empty.push([x, y]);
  if (!empty.length) return null;
  const [x, y] = empty[Math.floor(Math.random() * empty.length)];
  const tile = { id: nextId++, val: Math.random() < 0.9 ? 2 : 4, x, y };
  grid[y][x] = tile;
  createTileNode(tile, 'new');
  return tile;
}

function cleanupDying() {
  clearTimeout(dyingTimer);
  dyingTimer = 0;
  if (pendingMergeFinalizer) {
    const fn = pendingMergeFinalizer;
    pendingMergeFinalizer = null;
    fn();
  }
  const b = document.getElementById('board');
  b.querySelectorAll('.tile.dying').forEach(el => el.remove());
}

function move(dir) {
  if (over) return;
  cleanupDying();

  const vectors = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] };
  const vec = vectors[dir];
  if (!vec) return;

  const xs = dir === 'right' ? [3, 2, 1, 0] : [0, 1, 2, 3];
  const ys = dir === 'down' ? [3, 2, 1, 0] : [0, 1, 2, 3];

  let moved = false;
  let addScore = 0;
  const mergedEvents = [];
  const dyingNodes = [];

  const nextGrid = Array.from({ length: N }, () => Array(N).fill(null));

  if (vec[0] !== 0) {
    // Horizontal move
    for (const y of ys) {
      const line = [];
      for (const x of xs) if (grid[y][x]) line.push(grid[y][x]);
      let slotIdx = 0;
      for (let i = 0; i < line.length; ) {
        const tx = xs[slotIdx];
        const a = line[i];
        const b = i + 1 < line.length ? line[i + 1] : null;
        if (b && a.val === b.val) {
          const newVal = a.val * 2;
          addScore += newVal;
          if (newVal === 2048) won = true;
          a.x = tx; a.y = y;
          b.x = tx; b.y = y;
          const elA = tileNodes.get(a.id);
          const elB = tileNodes.get(b.id);
          const pos = tileXY(tx, y);
          [elA, elB].forEach(el => {
            if (!el) return;
            el.style.zIndex = '1';
            el.classList.add('dying');
            el.style.transform = `translate3d(${pos.px}px, ${pos.py}px, 0)`;
            dyingNodes.push(el);
          });
          tileNodes.delete(a.id);
          tileNodes.delete(b.id);

          const mTile = { id: nextId++, val: newVal, x: tx, y };
          nextGrid[y][tx] = mTile;
          mergedEvents.push(mTile);
          moved = true;
          i += 2;
        } else {
          if (a.x !== tx || a.y !== y) moved = true;
          a.x = tx; a.y = y;
          nextGrid[y][tx] = a;
          const elA = tileNodes.get(a.id);
          if (elA) {
            elA.classList.remove('new', 'merged');
            const pos = tileXY(tx, y);
            elA.style.transform = `translate3d(${pos.px}px, ${pos.py}px, 0)`;
          }
          i += 1;
        }
        slotIdx++;
      }
    }
  } else {
    // Vertical move
    for (const x of xs) {
      const line = [];
      for (const y of ys) if (grid[y][x]) line.push(grid[y][x]);
      let slotIdx = 0;
      for (let i = 0; i < line.length; ) {
        const ty = ys[slotIdx];
        const a = line[i];
        const b = i + 1 < line.length ? line[i + 1] : null;
        if (b && a.val === b.val) {
          const newVal = a.val * 2;
          addScore += newVal;
          if (newVal === 2048) won = true;
          a.x = x; a.y = ty;
          b.x = x; b.y = ty;
          const elA = tileNodes.get(a.id);
          const elB = tileNodes.get(b.id);
          const pos = tileXY(x, ty);
          [elA, elB].forEach(el => {
            if (!el) return;
            el.style.zIndex = '1';
            el.classList.add('dying');
            el.style.transform = `translate3d(${pos.px}px, ${pos.py}px, 0)`;
            dyingNodes.push(el);
          });
          tileNodes.delete(a.id);
          tileNodes.delete(b.id);

          const mTile = { id: nextId++, val: newVal, x, y: ty };
          nextGrid[ty][x] = mTile;
          mergedEvents.push(mTile);
          moved = true;
          i += 2;
        } else {
          if (a.x !== x || a.y !== ty) moved = true;
          a.x = x; a.y = ty;
          nextGrid[ty][x] = a;
          const elA = tileNodes.get(a.id);
          if (elA) {
            elA.classList.remove('new', 'merged');
            const pos = tileXY(x, ty);
            elA.style.transform = `translate3d(${pos.px}px, ${pos.py}px, 0)`;
          }
          i += 1;
        }
        slotIdx++;
      }
    }
  }

  if (!moved) return;
  grid = nextGrid;
  score += addScore;

  // Create merged tile DOM elements with pop animation and FX
  const boardRect = document.getElementById('board').getBoundingClientRect();
  const delayMs = (window.ArcadeFX && ArcadeFX.reducedMotion()) ? 0 : 135;
  const finishMerge = () => {
    pendingMergeFinalizer = null;
    dyingNodes.forEach(el => el.remove());
    mergedEvents.forEach(mt => {
      if (grid[mt.y][mt.x] === mt && !tileNodes.has(mt.id)) {
        createTileNode(mt, 'merged');
      }
    });
  };
  if (delayMs === 0) {
    finishMerge();
  } else {
    pendingMergeFinalizer = finishMerge;
    dyingTimer = setTimeout(finishMerge, delayMs);
  }

  if (mergedEvents.length && window.ArcadeFX) {
    ArcadeFX.vibrate(8);
    if (window.LobbyUI) LobbyUI.sound('click');
    mergedEvents.forEach(mt => {
      const pos = tileXY(mt.x, mt.y);
      const vx = boardRect.left + pos.px + cell * 0.5;
      const vy = boardRect.top + pos.py + cell * 0.5;
      ArcadeFX.floatText(vx, vy - 10, '+' + mt.val, {
        color: mt.val >= 128 ? '#fde047' : '#bae6fd',
        size: mt.val >= 256 ? 18 : 15
      });
      if (mt.val >= 64) {
        ArcadeFX.burst(vx, vy, {
          count: mt.val >= 512 ? 22 : 14,
          speed: 190,
          colors: ['#fde047', '#fb923c', '#ff2238', '#ffffff'],
          shape: 'spark'
        });
      }
    });
  } else if (window.LobbyUI) {
    LobbyUI.sound('move');
  }

  document.getElementById('score').textContent = score;
  if (score > best) {
    best = score;
    localStorage.setItem('g2048_best', String(best));
    document.getElementById('best').textContent = best;
  }

  spawnTile();

  if (won) {
    won = false;
    over = true;
    setTimeout(() => endGame(true), 240);
  } else if (!canMove()) {
    over = true;
    if (window.ArcadeFX) ArcadeFX.shake(document.getElementById('board'), 7, 300);
    setTimeout(() => endGame(false), 320);
  }
}

function maxTile() {
  let mx = 0;
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      if (grid[y][x] && grid[y][x].val > mx) mx = grid[y][x].val;
    }
  }
  return mx;
}

function canMove() {
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      if (!grid[y][x]) return true;
      const v = grid[y][x].val;
      if (x < N - 1 && grid[y][x + 1] && v === grid[y][x + 1].val) return true;
      if (y < N - 1 && grid[y + 1][x] && v === grid[y + 1][x].val) return true;
    }
  }
  return false;
}

function endGame(isWin) {
  const isNewRecord = score > runStartBest && score > 0;
  if (window.ArcadeFX) ArcadeFX.vibrate(isWin ? [20, 30, 20] : 25);
  if (window.LobbyUI) LobbyUI.sound(isWin ? 'win' : 'lose');
  if (isWin && window.ArcadeFX) ArcadeFX.confetti();
  if (window.ArcadeFX) {
    ArcadeFX.showGameOver({
      lang: LANG,
      title: isWin ? t('win_title') : undefined,
      subtitle: isWin ? t('win_sub') : undefined,
      score,
      best,
      isNewRecord,
      stats: [{ label: t('max_tile_lbl'), value: maxTile() }],
      onRestart: () => newGame()
    });
  }
}

let sx = null, sy = null;
const boardEl = document.getElementById('board');
boardEl.addEventListener('touchstart', e => {
  sx = e.touches[0].clientX;
  sy = e.touches[0].clientY;
}, { passive: true });
boardEl.addEventListener('touchend', e => {
  if (sx == null) return;
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  sx = sy = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
  else move(dy > 0 ? 'down' : 'up');
}, { passive: true });

window.addEventListener('keydown', e => {
  const m = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }[e.key];
  if (m) { e.preventDefault(); move(m); }
});
window.addEventListener('resize', () => { layout(); });

document.addEventListener('DOMContentLoaded', () => {
  applyUI();
  layout();
  newGame();
});
</script>
