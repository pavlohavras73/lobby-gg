<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title data-i18n="doc_title">UNO — Lobby.gg</title>
<link rel="icon" type="image/svg+xml" href="/games/static/favicon.svg">
<link rel="stylesheet" href="/games/static/theme.css">
<link rel="stylesheet" href="/games/static/game-ui.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    user-select: none; -webkit-user-select: none; color: #fff;
  }

  .game-layout {
    width: 100%; height: 100dvh; display: flex; flex-direction: column; justify-content: space-between;
    padding: max(10px, var(--sat)) 12px max(58px, calc(var(--sab) + 52px));
    background: radial-gradient(circle at 50% 42%, rgba(255, 34, 56, 0.16), transparent 62%), var(--bg);
    position: relative;
  }

  .uno-header {
    width: 100%; max-width: 520px; margin: 0 auto 6px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    flex-shrink: 0; z-index: 20;
  }
  .uno-brand-mini {
    font-family: var(--display); font-size: 16px; font-weight: 800; letter-spacing: -.3px;
    background: linear-gradient(90deg, #ffcc00, #ff2238); -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .lobby-card {
    background: linear-gradient(180deg, rgba(28, 28, 36, 0.92), rgba(14, 14, 19, 0.96));
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    border: 1px solid var(--border-hi); border-radius: 26px; padding: 22px 18px;
    max-width: 400px; width: 100%; margin: auto; text-align: center;
    box-shadow: var(--inner), var(--shadow-lg), 0 0 50px -18px rgba(255, 34, 56, 0.25);
  }
  .uno-logo-svg { width: 72px; height: 72px; margin: 0 auto 6px; display: block; filter: drop-shadow(0 10px 20px rgba(255, 34, 56, 0.35)); transition: transform .2s var(--ease); }
  .lobby-title {
    font-family: var(--display); font-size: 28px; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(95deg, #ffcc00 0%, #ff5a36 50%, #ff2238 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 4px;
  }
  .lobby-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; font-weight: 600; }

  /* ── Opponents with Avatars ── */
  .opponents-row {
    display: flex; gap: 8px; justify-content: center; overflow-x: auto; padding: 4px 2px 6px;
    max-width: 560px; width: 100%; margin: 0 auto; flex-shrink: 0;
    scrollbar-width: none;
  }
  .opponents-row::-webkit-scrollbar { display: none; }
  .opp-card {
    background: rgba(20, 20, 28, 0.85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1.5px solid var(--border); border-radius: 16px; padding: 6px 10px 6px 6px;
    display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700;
    box-shadow: var(--shadow-sm); transition: transform .22s var(--spring), border-color .25s, box-shadow .25s;
    flex-shrink: 0;
  }
  .opp-card .player-av { width: 26px; height: 26px; font-size: 11px; position: relative; }
  .opp-card.active-turn {
    border-color: var(--crimson);
    background: linear-gradient(135deg, rgba(255, 34, 56, 0.22), rgba(20, 20, 28, 0.92));
    box-shadow: 0 0 20px -2px var(--crimson-glow);
    transform: translateY(-2px) scale(1.04);
  }
  .opp-card.active-turn .player-av {
    box-shadow: 0 0 0 2px #fff, 0 0 12px var(--crimson);
  }
  .opp-cnt {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 800;
    background: rgba(255, 255, 255, 0.08); color: #ffd43b;
  }
  .uno-shout {
    background: linear-gradient(135deg, #ffcc00, #ff6b00); color: #111;
    padding: 2px 6px; border-radius: 6px; font-size: 10px; font-weight: 900;
    letter-spacing: .5px; animation: pulseDot 1s infinite;
  }

  /* ── Center Table & Direction ── */
  .center-play-area {
    position: relative; display: flex; align-items: center; justify-content: center;
    gap: 20px; margin: auto 0; padding: 14px 0; flex-shrink: 0;
  }
  .table-aura {
    position: absolute; width: 230px; height: 230px; border-radius: 50%;
    filter: blur(50px); opacity: 0.3; pointer-events: none;
    transition: background-color 0.45s ease; z-index: 0;
  }
  .dir-badge {
    width: 34px; height: 34px; border-radius: 50%; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-hi);
    color: rgba(255, 255, 255, 0.8);
    transition: transform 0.35s var(--spring);
  }
  .dir-badge svg { width: 18px; height: 18px; animation: dirSpinCw 9s linear infinite; }
  .dir-badge.ccw svg { animation: dirSpinCcw 9s linear infinite; }
  @keyframes dirSpinCw { to { transform: rotate(360deg); } }
  @keyframes dirSpinCcw { to { transform: rotate(-360deg); } }

  .burst-fx {
    position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
    z-index: 25; pointer-events: none;
    font-family: var(--display); font-size: 26px; font-weight: 900;
    color: #ffcc00; text-shadow: 0 4px 18px rgba(255, 34, 56, 0.85), 0 2px 0 #000;
    animation: burstFloat 1.1s var(--spring) forwards;
  }
  @keyframes burstFloat {
    0% { opacity: 0; transform: translate(-50%, 14px) scale(0.6); }
    25% { opacity: 1; transform: translate(-50%, -6px) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -32px) scale(0.95); }
  }

  .deck-pile {
    width: 78px; height: 114px; border-radius: 14px; position: relative; z-index: 2;
    background: linear-gradient(145deg, #23232f, #101016);
    border: 2.5px solid rgba(255, 255, 255, 0.85);
    box-shadow:
      -3px 3px 0 #181820, -4px 4px 0 rgba(255, 255, 255, 0.25),
      -6px 6px 0 #121218, -7px 7px 0 rgba(255, 255, 255, 0.16),
      0 14px 28px rgba(0, 0, 0, 0.75);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: transform .16s var(--spring), box-shadow .2s;
  }
  .deck-pile:hover { transform: translateY(-3px); }
  .deck-pile:active { transform: scale(0.93); }
  .deck-pile.can-draw { box-shadow: -3px 3px 0 #181820, -4px 4px 0 rgba(255,255,255,.3), 0 0 22px rgba(255, 255, 255, 0.25), 0 14px 28px rgba(0,0,0,.8); }
  .deck-emblem {
    width: 54px; height: 76px; border-radius: 10px;
    background: radial-gradient(circle at 50% 45%, #ff2238, #8c0615);
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid rgba(255, 255, 255, 0.25);
  }
  .deck-emblem span {
    font-family: var(--display); font-size: 13px; font-weight: 900; color: #ffcc00;
    transform: rotate(-22deg); text-shadow: 0 2px 0 #000; letter-spacing: -.5px;
  }

  .discard-wrap {
    position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .color-pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
    border-radius: 999px; background: rgba(15, 15, 22, 0.78); border: 1px solid var(--border-hi);
    font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .5px;
  }
  .current-color-indicator {
    width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff;
    box-shadow: 0 0 10px currentColor; transition: background-color .3s;
  }

  /* ── Real UNO Card ── */
  .uno-card {
    width: 74px; height: 110px; border-radius: 13px; border: 3px solid #ffffff;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--display); font-weight: 800; color: #fff;
    cursor: pointer; user-select: none; position: relative; flex-shrink: 0; overflow: hidden;
    transition: transform 0.18s var(--spring), box-shadow 0.18s, opacity 0.18s, filter 0.18s;
  }
  .uno-card::before {
    content: ""; position: absolute; width: 122%; height: 68%;
    border-radius: 50%; border: 2.5px solid rgba(255, 255, 255, 0.85);
    background: rgba(255, 255, 255, 0.1);
    transform: rotate(-26deg); pointer-events: none;
  }
  .uno-card .c-tl, .uno-card .c-br {
    position: absolute; font-size: 11px; font-weight: 900; line-height: 1;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55); z-index: 2;
  }
  .uno-card .c-tl { top: 5px; left: 6px; }
  .uno-card .c-br { bottom: 5px; right: 6px; transform: rotate(180deg); }
  .uno-card .c-mid {
    position: relative; z-index: 2; font-size: 28px; line-height: 1;
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45), 0 4px 10px rgba(0, 0, 0, 0.4);
    display: flex; align-items: center; justify-content: center;
  }
  .uno-card .c-mid svg { width: 32px; height: 32px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
  .uno-card .c-mid.num-69::after {
    content: ""; position: absolute; bottom: -3px; left: 20%; right: 20%;
    height: 2.5px; background: currentColor; border-radius: 2px;
  }

  .uno-card.red { background: linear-gradient(145deg, #ff3347, #b9071a); }
  .uno-card.yellow { background: linear-gradient(145deg, #ffd426, #d49800); color: #161616; }
  .uno-card.yellow .c-tl, .uno-card.yellow .c-br { color: #161616; text-shadow: none; }
  .uno-card.yellow .c-mid { text-shadow: 0 1px 0 rgba(255,255,255,.35); }
  .uno-card.green { background: linear-gradient(145deg, #27d466, #138a3e); }
  .uno-card.blue { background: linear-gradient(145deg, #4389ff, #1a49c9); }
  .uno-card.wild { background: linear-gradient(145deg, #1d1d26, #0c0c12); }
  .uno-card.wild::before {
    background: conic-gradient(from -20deg, rgba(255,34,56,.85) 0 25%, rgba(255,204,0,.85) 25% 50%, rgba(34,197,94,.85) 50% 75%, rgba(59,130,246,.85) 75%);
    opacity: 0.9;
  }

  #topcard .uno-card {
    width: 82px; height: 120px; cursor: default;
    box-shadow: 0 18px 36px rgba(0, 0, 0, 0.8), 0 0 24px rgba(255, 255, 255, 0.12);
    animation: cardSlam 0.3s var(--spring) both;
  }
  @keyframes cardSlam {
    from { opacity: 0; transform: scale(1.22) rotate(-6deg) translateY(-10px); }
    to { opacity: 1; transform: scale(1) rotate(0deg) translateY(0); }
  }

  .flying-card {
    position: fixed; z-index: 99990; pointer-events: none; margin: 0 !important;
    transition: transform 280ms cubic-bezier(.22, 1, .36, 1), opacity 280ms ease;
  }

  /* ── Hand Fan ── */
  .hand-section { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .hand-container {
    display: flex; align-items: flex-end; justify-content: safe center;
    overflow-x: auto; overflow-y: visible;
    padding: 20px 16px 10px; min-height: 136px;
    max-width: 100%; scrollbar-width: none;
  }
  .hand-container::-webkit-scrollbar { display: none; }
  .hand-container .uno-card { margin-left: -16px; }
  .hand-container .uno-card:first-child { margin-left: 0; }
  .hand-container .uno-card.dim { opacity: 0.52; filter: saturate(0.7); }
  .hand-container .uno-card.playable {
    transform: translateY(-6px);
    box-shadow: 0 0 0 2px rgba(255,255,255,.7), 0 12px 24px rgba(0, 0, 0, 0.8);
  }
  .hand-container .uno-card.playable:hover { transform: translateY(-12px); z-index: 5; }
  .hand-container .uno-card.selected {
    transform: translateY(-20px) scale(1.07); z-index: 10;
    box-shadow: 0 0 0 2.5px #fff, 0 0 24px rgba(255, 34, 56, 0.85), 0 18px 30px rgba(0, 0, 0, 0.85);
  }
  .hand-container .uno-card:active { transform: scale(0.94); }

  .uno-call-btn {
    padding: 5px 12px; border-radius: 999px; border: 0; width: auto; min-height: 30px !important;
    font-family: var(--display); font-size: 11px; font-weight: 900; letter-spacing: .6px;
    background: linear-gradient(135deg, #ffcc00, #ff6b00); color: #111;
    box-shadow: 0 0 18px rgba(255, 204, 0, 0.6); cursor: pointer;
    animation: pulseDot 1s infinite;
  }

  .action-bar-wrap {
    background: linear-gradient(180deg, rgba(22, 22, 30, 0.9), rgba(12, 12, 18, 0.95));
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-hi); border-radius: 22px; padding: 10px 14px;
    max-width: 480px; width: 100%; margin: 0 auto;
    box-shadow: var(--inner), var(--shadow-md);
    display: flex; flex-direction: column; gap: 6px; text-align: center; flex-shrink: 0;
  }
  #actions { display: flex; gap: 8px; }
  #actions button { margin: 0; }

  .btn-action-primary {
    width: 100%; background: linear-gradient(135deg, #ff3448, #c40f23); color: #fff;
    border: 0; padding: 12px 16px; border-radius: 14px; font-weight: 800; font-size: 14px;
    letter-spacing: 0.3px; cursor: pointer; min-height: 44px;
    box-shadow: 0 6px 20px -4px rgba(255, 34, 56, 0.55); transition: transform 0.15s;
  }
  .btn-action-primary:active { transform: scale(0.96); }

  .color-picker-overlay {
    position: fixed; inset: 0; z-index: 100000; background: rgba(4, 4, 8, 0.86);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    opacity: 0; pointer-events: none; transition: opacity 0.22s ease;
  }
  .color-picker-overlay.open { opacity: 1; pointer-events: auto; }
  .color-wheel {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: 220px; height: 220px;
    animation: popin .28s var(--spring) both;
  }
  .color-wheel-btn {
    border-radius: 22px; border: 3px solid #fff; cursor: pointer; transition: transform 0.15s;
    min-height: 96px;
  }
  .color-wheel-btn:active { transform: scale(0.92); }
  .color-wheel-btn.red { background: linear-gradient(135deg, #ff3347, #b9071a); box-shadow: 0 0 28px rgba(255,34,56,0.6); }
  .color-wheel-btn.yellow { background: linear-gradient(135deg, #ffd426, #d49800); box-shadow: 0 0 28px rgba(255,204,0,0.6); }
  .color-wheel-btn.green { background: linear-gradient(135deg, #27d466, #138a3e); box-shadow: 0 0 28px rgba(34,197,94,0.6); }
  .color-wheel-btn.blue { background: linear-gradient(135deg, #4389ff, #1a49c9); box-shadow: 0 0 28px rgba(59,130,246,0.6); }

  @media (max-width: 380px) {
    .uno-card { width: 64px; height: 96px; }
    .uno-card .c-mid { font-size: 24px; }
    .uno-card .c-mid svg { width: 26px; height: 26px; }
    #topcard .uno-card { width: 72px; height: 108px; }
    .deck-pile { width: 68px; height: 102px; }
    .center-play-area { gap: 14px; }
    .hand-container { min-height: 120px; padding: 16px 12px 8px; }
  }
</style>
<script src="/games/static/i18n_common.js"></script>
<script src="/games/static/ui.js"></script>
</head>
<body>

  <div id="rulesModal" class="rules-modal-overlay" style="display:none" onclick="if(event.target===this)this.style.display='none'">
    <div class="rules-modal-card">
      <div class="rules-modal-title" data-i18n="rules_title">UNO — Правила</div>
      <div class="rules-modal-body" data-i18n="rules_body">Скидывай карту того же цвета или достоинства, что сверху. Спецкарты: +2, +4, смена цвета, пропуск хода, разворот. Остался с 1 картою — жми UNO! Первый без карт — победитель.</div>
      <button id="rulesOk" style="margin-top:16px" data-i18n="rules_ok">Понятно</button>
    </div>
  </div>

  <div class="game-layout">
    <header class="uno-header">
      <a href="/games/" class="game-nav-back" data-i18n="nav_games">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        <span>Игры</span>
      </a>
      <span class="uno-brand-mini">UNO</span>
      <button id="rulesBtn" class="rules-btn" data-i18n-title="rules_btn" title="Правила">i</button>
    </header>

    <div id="home" class="lobby-card screen-enter">
      <svg class="uno-logo-svg" id="unoLogo" viewBox="0 0 64 64" fill="none">
        <rect x="8" y="10" width="30" height="44" rx="7" transform="rotate(-14 23 32)" fill="#1a1a24" stroke="#fff" stroke-width="2.5"/>
        <rect x="24" y="10" width="30" height="44" rx="7" transform="rotate(9 39 32)" fill="url(#unoG)" stroke="#fff" stroke-width="2.5"/>
        <ellipse cx="39" cy="32" rx="9" ry="15" transform="rotate(-18 39 32)" fill="rgba(255,255,255,0.22)" stroke="#fff" stroke-width="2"/>
        <defs><linearGradient id="unoG" x1="24" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse"><stop stop-color="#ff3347"/><stop offset="1" stop-color="#b9071a"/></linearGradient></defs>
      </svg>
      <div class="lobby-title">UNO</div>
      <div class="lobby-sub" data-i18n="tagline">По цвету или достоинству · 2-10 Игроков</div>
      <div class="langbar" id="langbar" style="margin-bottom:14px"><button type="button" data-lang="uk">УКР</button><button type="button" data-lang="ru">РУС</button><button type="button" data-lang="en">ENG</button><button type="button" data-lang="de">DEU</button></div>
      <div class="lobby-field-wrap">
        <span class="field-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></span>
        <input id="name" placeholder="Твое имя" maxlength="20" data-i18n-ph="ph_name">
      </div>
      <button onclick="create()" data-i18n="btn_create">Создать Комнату</button>
      <div class="pin-row">
        <input id="joincode" placeholder="КОД ИГРЫ" maxlength="4" data-i18n-ph="ph_code">
        <div class="pin-boxes" id="pinBoxes"></div>
        <button class="sec" onclick="join()" style="width:auto;flex-shrink:0;padding:12px 18px;margin:0;height:52px" data-i18n="btn_join">Войти</button>
      </div>
    </div>

    <div id="lobby" class="lobby-card hide">
      <div class="lobby-title" style="font-size:22px" data-i18n="lobby_room">КОМНАТА</div>
      <div class="pin-display" onclick="copyRoomCode()" title="Copy">
        <div id="lcodeDigits" style="display:flex;gap:8px"></div>
        <span id="lcode" style="display:none">----</span>
      </div>
      <div class="lobby-sub" id="waitmsg" data-i18n="wait_players">Ждём игроков...</div>
      <div id="players" style="display:flex;flex-direction:column;gap:6px;margin:10px 0 14px"></div>

      <div id="botrow" class="hide" style="margin-bottom:8px">
        <button class="sec" onclick="send({action:'add_bot',diff:'medium'})" data-i18n="btn_addbot">+ Добавить Бота</button>
      </div>
      <button id="startbtn" class="hide" onclick="send({action:'start'})" style="background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 8px 24px -6px rgba(34,197,94,.55)" data-i18n="btn_start">Раздать Карты</button>
    </div>

    <div id="game" class="hide" style="width:100%;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between">
      <div class="opponents-row" id="opponents"></div>

      <div class="center-play-area" id="centerArea">
        <div class="table-aura" id="tableAura"></div>
        <div class="deck-pile" id="deckpile">
          <div class="deck-emblem"><span>UNO</span></div>
        </div>
        <div class="dir-badge" id="dirBadge" title="Direction">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
        </div>
        <div class="discard-wrap">
          <div class="color-pill">
            <span data-i18n="lbl_color">ЦВЕТ:</span>
            <span class="current-color-indicator" id="curcolor"></span>
          </div>
          <div id="topcard"></div>
        </div>
      </div>

      <div class="hand-section">
        <div style="display:flex;align-items:center;justify-content:center;gap:8px">
          <span class="turn-pill opp-turn" id="turninfo" style="margin:0"><span class="turn-dot"></span><span id="turntext"></span></span>
          <button class="uno-call-btn hide" id="unoShoutBtn" onclick="shoutUno()">UNO!</button>
        </div>
        <div class="hand-container" id="hand"></div>
      </div>

      <div class="action-bar-wrap">
        <div id="log" style="font-size:12px;color:var(--muted);min-height:16px"></div>
        <div id="actions"></div>
      </div>
    </div>

    <div id="over" class="lobby-card hide">
      <div id="overIcon" style="margin-bottom:10px"></div>
      <div id="overtext" style="font-family:var(--display);font-size:24px;font-weight:800;color:#fff;margin-bottom:12px"></div>
      <div id="overSummary" style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px"></div>
      <button class="btn-action-primary" onclick="location.reload()" data-i18n="btn_newgame">Новая Партия</button>
    </div>

  </div>

  <div class="color-picker-overlay" id="picker">
    <div style="font-family:var(--display);font-size:18px;font-weight:800;color:#fff" data-i18n="choose_color">Выбери новый цвет:</div>
    <div class="color-wheel">
      <div class="color-wheel-btn red" onclick="pickColor(0)"></div>
      <div class="color-wheel-btn yellow" onclick="pickColor(1)"></div>
      <div class="color-wheel-btn green" onclick="pickColor(2)"></div>
      <div class="color-wheel-btn blue" onclick="pickColor(3)"></div>
    </div>
  </div>

  <script src="/games/static/sfx.js"></script>
  <script src="/games/static/invite.js"></script>
  <script src="/games/static/reconnect.js"></script>
  <script src="/games/static/room_chat.js"></script>
  <script>
    const UI = {

      },

        rules_body: "Lege eine passende Karte nach Farbe oder Zahl ab. Aktionskarten: +2, +4, Farbwunsch, Aussetzen, Richtungswechsel. Bei 1 Restkarte — drücke UNO! Wer zuerst alle Karten loswird, gewinnt.",
        rules_ok: "Verstanden",
        nav_games: "Spiele",
        tagline: "Farbe oder Zahl bedienen · 2-10 Spieler",
        ph_name: "Dein Name",
        btn_create: "Raum erstellen",
        ph_code: "RAUMCODE",
        btn_join: "Beitreten",
        lobby_room: "RAUM",
        wait_players: "Warte auf Spieler...",
        btn_addbot: "+ Bot hinzufügen",
        btn_start: "Karten austeilen",
        lbl_color: "FARBE:",
        choose_color: "Wähle eine neue Farbe:",
        your_turn: "DU BIST DRAN!",
        turn_of: name => "Am Zug: " + name,
        btn_play: n => "Spielen (" + n + ")",
        btn_draw: "Karte ziehen",
        btn_pass: "Weiter",
        btn_newgame: "Neues Spiel",
        win_you: "DU HAST GEWONNEN!",
        win_other: name => "Gewinner: " + name,
        conn_lost: "Verbindung verloren, bitte aktualisieren.",
        ask_code: "Code eingeben!",
        def_player: "Spieler",
        copied: "Code kopiert",
        cards_left: n => n + " Karten"
      }
    };

    const CLS = ["red", "yellow", "green", "blue"];
    const HEX = ["#ff2238", "#ffcc00", "#22c55e", "#3b82f6"];
    const esc = s => window.LobbyUI ? LobbyUI.esc(s) : String(s ?? '');

    function cornerLabel(v) {
      return v === 'skip' ? '⊘' : v === 'rev' ? '⇄' : v === 'd2' ? '+2' : v === 'wild' ? '★' : v === 'wd4' ? '+4' : v;
    }

    function centerGraphic(v) {
      if (v === 'skip') {
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><circle cx="12" cy="12" r="8"/><line x1="6.3" y1="6.3" x2="17.7" y2="17.7"/></svg>`;
      }
      if (v === 'rev') {
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>`;
      }
      if (v === 'wild') {
        return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="2"/><path d="M12 3a9 9 0 0 1 9 9h-9z" fill="#ff2238"/><path d="M21 12a9 9 0 0 1-9 9v-9z" fill="#ffcc00"/><path d="M12 21a9 9 0 0 1-9-9h9z" fill="#22c55e"/><path d="M3 12a9 9 0 0 1 9-9v9z" fill="#3b82f6"/></svg>`;
      }
      if (v === 'd2') {
        return `<span style="font-size:22px;font-weight:900;letter-spacing:-1px">+2</span>`;
      }
      if (v === 'wd4') {
        return `<span style="font-size:22px;font-weight:900;letter-spacing:-1px">+4</span>`;
      }
      return esc(v);
    }

    let LANG = localStorage.getItem('jg_lang');
    if (!UI[LANG]) LANG = 'ru';
    function t(k) {
      const v = UI[LANG] && UI[LANG][k];
      return v !== undefined ? v : (UI.ru[k] || k);
    }

    let ws = null, pid = null, st = null, isHost = false, pendingCards = null, selIdx = [], roomCode = null, firstOpenCb = null, opened = false;
    let lastTopKey = '', lastHandLen = 0, pendingFlyFrom = null, pendingDrawFly = false;

    function applyUI() {
      document.documentElement.lang = LANG;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const v = t(el.dataset.i18n);
        if (typeof v !== 'string') return;
        if (el.tagName.toLowerCase() === 'title') document.title = v;
        else {
          const sp = el.querySelector('span');
          if (sp) sp.textContent = v;
          else el.textContent = v;
        }
      });
      document.querySelectorAll('[data-i18n-ph]').forEach(el => {
        const v = t(el.dataset.i18nPh);
        if (typeof v === 'string') el.placeholder = v;
      });
      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        const v = t(el.dataset.i18nTitle);
        if (typeof v === 'string') el.title = v;
      });
      document.querySelectorAll('#langbar button').forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
      if (st) renderState(st);
    }

    document.getElementById('langbar').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      LANG = b.dataset.lang;
      localStorage.setItem('jg_lang', LANG);
      applyUI();
    });
    document.getElementById('rulesBtn').onclick = () => document.getElementById('rulesModal').style.display = 'flex';
    document.getElementById('rulesOk').onclick = () => document.getElementById('rulesModal').style.display = 'none';

    function show(id) {
      if (window.LobbyUI) LobbyUI.showScreen(['home', 'lobby', 'game', 'over'], id);
      else {
        for (const s of ['home', 'lobby', 'game', 'over']) document.getElementById(s).classList.add('hide');
        document.getElementById(id).classList.remove('hide');
      }
    }

    function copyRoomCode() {
      if (roomCode && window.LobbyUI) LobbyUI.copyText(roomCode, t('copied'));
    }

    function shoutUno() {
      if (window.LobbyUI) { LobbyUI.sound('win'); LobbyUI.vibrate([20, 30, 20]); LobbyUI.toast('UNO!', 'ok', 1400); }
    }

    function send(o) { if (ws) ws.send(o); }

    function connect(cb) {
      if (ws && ws.getSocket && ws.getSocket().readyState === 1) { if (cb) cb(); return; }
      firstOpenCb = cb;
      ws = JarvisWS("/games/ws", {
        onopen: () => {
          if (!opened) { opened = true; const f = firstOpenCb; firstOpenCb = null; if (f) f(); return; }
          if (roomCode) ws.send({ action: 'join', name: document.getElementById('name').value || t('def_player'), code: roomCode });
        },
        onmessage: (e) => handle(JSON.parse(e.data))
      });
    }

    function create() {
      const n = document.getElementById('name').value || t('def_player');
      connect(() => send({ action: 'create', name: n, game: 'uno' }));
    }

    function join() {
      const n = document.getElementById('name').value || t('def_player');
      const c = document.getElementById('joincode').value;
      if (!c) return window.LobbyUI ? LobbyUI.toast(t('ask_code'), 'err') : alert(t('ask_code'));
      connect(() => send({ action: 'join', name: n, code: c }));
    }

    function cardHTML(c, extra = '') {
      if (!c) return '';
      const cls = c.c === 4 ? 'wild' : CLS[c.c];
      const lbl = esc(cornerLabel(c.v));
      const num69 = (c.v === '6' || c.v === '9' || c.v === 6 || c.v === 9) ? ' num-69' : '';
      return `<div class="uno-card ${cls}${extra}">
        <span class="c-tl">${lbl}</span>
        <span class="c-mid${num69}">${centerGraphic(c.v)}</span>
        <span class="c-br">${lbl}</span>
      </div>`;
    }

    function canPlay(c) {
      if (!st) return false;
      const top = st.top, cur = st.cur_color;
      return c.c === 4 || c.c === cur || c.v === top.v;
    }

    function flyCard(fromRect, toRect, html) {
      if (!fromRect || !toRect) return;
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      const ghost = tmp.firstElementChild;
      if (!ghost) return;
      ghost.classList.add('flying-card');
      ghost.style.left = fromRect.left + 'px';
      ghost.style.top = fromRect.top + 'px';
      ghost.style.width = fromRect.width + 'px';
      ghost.style.height = fromRect.height + 'px';
      document.body.appendChild(ghost);
      const dx = (toRect.left + toRect.width / 2) - (fromRect.left + fromRect.width / 2);
      const dy = (toRect.top + toRect.height / 2) - (fromRect.top + fromRect.height / 2);
      requestAnimationFrame(() => {
        ghost.style.transform = `translate(${dx}px, ${dy}px) scale(1.05)`;
        ghost.style.opacity = '0.2';
      });
      setTimeout(() => ghost.remove(), 300);
    }

    function spawnBurst(txt) {
      const ca = document.getElementById('centerArea');
      if (!ca) return;
      const b = document.createElement('div');
      b.className = 'burst-fx';
      b.textContent = txt;
      ca.appendChild(b);
      setTimeout(() => b.remove(), 1150);
    }

    function toggleSel(i) {
      if (!st || st.turn_pid !== pid) return;
      const hand = st.hand, c = hand[i];
      if (selIdx.length === 0) { if (!canPlay(c)) return; selIdx = [i]; }
      else if (selIdx.includes(i)) { selIdx = selIdx.filter(x => x !== i); }
      else if (hand[i].v === hand[selIdx[0]].v) { selIdx.push(i); }
      else { if (!canPlay(c)) return; selIdx = [i]; }

      if (window.LobbyUI) { LobbyUI.sound('move'); LobbyUI.vibrate(10); }
      renderHandActions();
    }

    function playSel() {
      if (!st || selIdx.length === 0) return;
      const cards = selIdx.map(i => st.hand[i]);
      const cardEls = document.querySelectorAll('#hand .uno-card');
      const firstEl = cardEls[selIdx[0]];
      if (firstEl) {
        pendingFlyFrom = { rect: firstEl.getBoundingClientRect(), html: cardHTML(cards[0]) };
      }
      if (cards.some(c => c.c === 4)) {
        pendingCards = cards;
        document.getElementById('picker').classList.add('open');
      } else {
        send({ action: 'uno_play', cards });
        selIdx = [];
      }
      if (window.LobbyUI) { LobbyUI.sound('flip'); LobbyUI.vibrate(14); }
    }

    function doDraw() {
      if (!st || st.turn_pid !== pid) return;
      pendingDrawFly = true;
      if (window.LobbyUI) { LobbyUI.sound('flip'); LobbyUI.vibrate(10); }
      send({ action: 'uno_draw' });
    }

    function pickColor(col) {
      document.getElementById('picker').classList.remove('open');
      if (pendingCards) {
        send({ action: 'uno_play', cards: pendingCards, color: col });
        pendingCards = null;
        selIdx = [];
      }
      if (window.LobbyUI) { LobbyUI.sound('click'); LobbyUI.vibrate(12); }
    }

    function renderHandActions() {
      if (!st) return;
      const m = st, myturn = (m.turn_pid === pid);
      document.getElementById('hand').innerHTML = m.hand.map((c, i) => {
        const ok = myturn && canPlay(c);
        const sel = selIdx.includes(i);
        const extra = (ok ? ' playable' : (myturn ? ' dim' : '')) + (sel ? ' selected' : '');
        return cardHTML(c, extra);
      }).join('');
      [...document.querySelectorAll('#hand .uno-card')].forEach((el, i) => el.onclick = () => toggleSel(i));

      const dp = document.getElementById('deckpile');
      if (dp) dp.classList.toggle('can-draw', myturn);

      const uBtn = document.getElementById('unoShoutBtn');
      if (uBtn) uBtn.classList.toggle('hide', m.hand.length !== 1);

      let btns = '';
      if (myturn) {
        if (selIdx.length) {
          const lbl = typeof t('btn_play') === 'function' ? t('btn_play')(selIdx.length) : ('Play (' + selIdx.length + ')');
          btns += `<button class="btn-action-primary" onclick="playSel()">${esc(lbl)}</button>`;
        } else {
          btns += `<button class="sec" style="margin:0" onclick="doDraw()">${esc(t('btn_draw'))}</button>`;
        }
        if ((m.last_action || '').includes('можно сыграть') || (m.last_action || '').includes('можна зіграти') || (m.last_action || '').includes('can be played')) {
          btns += `<button class="sec" style="margin:0;flex:0.6" onclick="send({action:'uno_pass'})">${esc(t('btn_pass'))}</button>`;
        }
      }
      document.getElementById('actions').innerHTML = btns;
    }

    function renderState(m) {
      st = m;
      if (m.winner) {
        show('over');
        const won = m.winner === pid;
        document.getElementById('overtext').textContent = won ? t('win_you') : (typeof t('win_other') === 'function' ? t('win_other')(m.names[m.winner] || '?') : ('Winner: ' + (m.names[m.winner] || '?')));
        document.getElementById('overIcon').innerHTML = won
          ? '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#ffcc00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20 7 22h10c0-2-0.85-3.25-2.03-3.79-.5-.23-.97-.66-.97-1.21v-2.34"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" fill="rgba(255,204,0,.22)"/></svg>'
          : '<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#8d8d98" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 15s1.5-2 4-2 4 2 4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>';
        document.getElementById('overSummary').innerHTML = (m.order || []).map(p => {
          const nm = m.names[p] || '?';
          const cnt = m.counts[p] ?? 0;
          const av = window.LobbyUI ? LobbyUI.avatarHtml(nm, String(p).startsWith('bot_')) : '';
          return `<div class="player-row-item">${av}<span>${esc(nm)}</span><span class="player-tag">${p === m.winner ? '🏆' : esc(t('cards_left')(cnt))}</span></div>`;
        }).join('');
        if (won && window.LobbyUI) {
          LobbyUI.confetti({ particleCount: 120, spread: 88 });
          LobbyUI.sound('win');
          LobbyUI.vibrate([20, 40, 30]);
        } else if (window.LobbyUI) {
          LobbyUI.sound('lose');
        }
        return;
      }
      show('game');
      const myturn = (m.turn_pid === pid);
      const opps = m.order.filter(p => p !== pid);

      document.getElementById('opponents').innerHTML = opps.map(p => {
        const active = p === m.turn_pid;
        const nm = m.names[p] || '?';
        const av = window.LobbyUI ? LobbyUI.avatarHtml(nm, String(p).startsWith('bot_')) : '';
        const uno = m.counts[p] === 1 ? '<span class="uno-shout">UNO!</span>' : '';
        return `<div class="opp-card ${active ? 'active-turn' : ''}">
          ${av}
          <span>${esc(nm)}</span>
          <span class="opp-cnt">${m.counts[p]}</span>
          ${uno}
        </div>`;
      }).join('');

      const db = document.getElementById('dirBadge');
      if (db) db.classList.toggle('ccw', m.dir === -1);

      const topKey = m.top ? `${m.top.c}:${m.top.v}:${m.cur_color}` : '';
      if (topKey !== lastTopKey) {
        const hadPrev = !!lastTopKey;
        lastTopKey = topKey;
        const tcEl = document.getElementById('topcard');
        tcEl.innerHTML = cardHTML(m.top);
        if (pendingFlyFrom && tcEl.firstElementChild) {
          flyCard(pendingFlyFrom.rect, tcEl.firstElementChild.getBoundingClientRect(), pendingFlyFrom.html);
          pendingFlyFrom = null;
        }
        if (hadPrev && m.top && (m.top.v === 'd2' || m.top.v === 'wd4')) {
          spawnBurst(m.top.v === 'd2' ? '+2!' : '+4!');
          if (window.LobbyUI) LobbyUI.vibrate([15, 25, 15]);
        }
      }
      if (pendingDrawFly && m.hand.length > lastHandLen) {
        pendingDrawFly = false;
        const dpEl = document.getElementById('deckpile');
        const hEl = document.getElementById('hand');
        if (dpEl && hEl) {
          flyCard(dpEl.getBoundingClientRect(), hEl.getBoundingClientRect(), '<div class="deck-pile" style="width:74px;height:110px"><div class="deck-emblem"><span>UNO</span></div></div>');
        }
      }
      lastHandLen = m.hand.length;

      const hex = HEX[m.cur_color] || '#ff2238';
      document.getElementById('curcolor').style.backgroundColor = hex;
      document.getElementById('curcolor').style.color = hex;
      document.getElementById('tableAura').style.backgroundColor = hex;

      const tp = document.getElementById('turninfo');
      tp.className = 'turn-pill ' + (myturn ? 'my-turn' : 'opp-turn');
      document.getElementById('turntext').textContent = myturn
        ? t('your_turn')
        : (typeof t('turn_of') === 'function' ? t('turn_of')(m.names[m.turn_pid] || '?') : ('Turn: ' + (m.names[m.turn_pid] || '?')));

      document.getElementById('log').textContent = window.LobbyI18n ? LobbyI18n.T(m.last_action || '') : (m.last_action || '');
      document.getElementById('deckpile').onclick = () => { if (myturn) doDraw(); };

      renderHandActions();
    }

    function handle(m) {
      if (m.type === 'joined') {
        pid = m.pid;
        isHost = m.host;
        roomCode = m.code;
        sessionStorage.setItem('jg_uno_code', m.code);
      }
      else if (m.type === 'lobby') {
        show('lobby');
        document.getElementById('lcode').textContent = m.code;
        const ld = document.getElementById('lcodeDigits');
        if (ld && window.LobbyUI) ld.innerHTML = LobbyUI.renderCodeDigits(m.code);
        document.getElementById('players').innerHTML = m.players.map(p => {
          const av = window.LobbyUI ? LobbyUI.avatarHtml(p.name, String(p.id || '').startsWith('bot_')) : '';
          return `<div class="player-row-item">${av}<span>${esc(p.name)}</span>${p.id === m.host ? '<span class="player-tag">HOST</span>' : ''}</div>`;
        }).join('');
        isHost = (m.host === pid);
        document.getElementById('startbtn').classList.toggle('hide', !isHost);
        document.getElementById('botrow').classList.toggle('hide', !isHost);
      }
      else if (m.type === 'uno_state') {
        selIdx = [];
        renderState(m);
      }
      else if (m.type === 'error') {
        const msg = window.LobbyI18n ? LobbyI18n.T(m.msg) : m.msg;
        if (window.LobbyUI) LobbyUI.toast(msg, 'err');
        else alert(msg);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyUI();
      if (window.LobbyUI && LobbyUI.initPinInput) LobbyUI.initPinInput('joincode', 'pinBoxes', join);
      if (window.LobbyUI && LobbyUI.enableParallax) LobbyUI.enableParallax(document.getElementById('unoLogo'), 10);
    });

    const autoCode = sessionStorage.getItem('jg_uno_code');
    if (autoCode) {
      const jc = document.getElementById('joincode');
      if (jc) jc.value = autoCode;
    }
  </script>
</body>
</html>
