<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title data-i18n="title">Шахматы — Lobby.gg</title>
<link rel="icon" type="image/svg+xml" href="/games/static/favicon.svg">

<style>
  .bd{display:grid;grid-template-columns:repeat(8,1fr);gap:1px;background:rgba(255,255,255,.05);border:1px solid var(--border);
      border-radius:12px;padding:6px;max-width:380px;margin:10px auto}
  .sq{aspect-ratio:1;background:#182838;border-radius:3px;display:flex;align-items:center;justify-content:center;position:relative}
  .sq.light{background:#2a3c50}
  .sq.sel{box-shadow:inset 0 0 0 2px var(--crimson)}
  .sq.dest{cursor:pointer}
  .sq.dest::after{content:"";width:22%;height:22%;border-radius:50%;background:rgba(255,34,56,.55);position:absolute}
  .sq.dest.capture::after{width:80%;height:80%;border-radius:50%;background:none;border:3px solid rgba(255,34,56,.6)}
  .sq.check{box-shadow:inset 0 0 0 3px #ff9500}
  .sq.lastmove{background:rgba(255,34,56,.16)}
  .sq.light.lastmove{background:rgba(255,34,56,.22)}
  .pc{width:82%;height:82%;cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));user-select:none;-webkit-user-drag:none}
  .turn{text-align:center;font-weight:700;margin:8px 0}.me{color:var(--crimson)}
  .cap-row{display:flex;flex-wrap:wrap;gap:2px;min-height:22px;max-width:380px;margin:4px auto;padding:0 6px}
  .cap-row img{width:18px;height:18px;opacity:.8}
  .langbar{display:flex;gap:4px;justify-content:center;margin:8px auto 0;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:999px;padding:4px;width:max-content}
  .langbar button{width:auto;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:800;font-size:12px;padding:4px 11px;border-radius:999px;cursor:pointer;letter-spacing:.5px}
  .langbar button.active{background:var(--crimson);color:#fff;box-shadow:0 0 14px rgba(255,34,56,.4)}
</style></head><body>

<a href="/games/" title="Ко всем играм" style="position:fixed;top:8px;left:8px;z-index:99999;background:rgba(10,10,14,.72);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:700;text-decoration:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)" data-i18n="nav_games" data-i18n-title="nav_games">🎮 Игры</a>

  <input id="joincode" placeholder="КОД" maxlength="4" style="text-transform:uppercase" data-i18n-ph="code_ph"><button class="sec" onclick="join()" data-i18n="join_btn">Войти</button>
  <div class="sub" style="margin-top:10px"><a href="/games" data-i18n="back_btn">← все игры</a></div></div>
<div id="lobby" class="card hide" style="max-width:360px;margin:0 auto;text-align:center">
  <div class="sub" data-i18n="room_code">Код:</div><div class="code" id="lcode">----</div><div id="players"></div>
  <div class="row" style="margin-top:8px"><div class="opts botdiff" style="margin:6px 0"><div class="opt" data-d="easy" onclick="this.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));this.classList.add('on')" data-i18n="diff_easy">🤖 Лёгкий</div><div class="opt on" data-d="medium" onclick="this.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));this.classList.add('on')" data-i18n="diff_medium">Средний</div><div class="opt" data-d="hard" onclick="this.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));this.classList.add('on')" data-i18n="diff_hard">Сложный</div></div><button class="sec" style="margin:0" onclick="send({action:'add_bot',diff:document.querySelector('.botdiff .opt.on').dataset.d})" data-i18n="add_bot_btn">🤖 Добавить</button></div>
  <div class="sub" id="waitmsg" data-i18n="wait_msg">Ждём второго…</div></div>
<div id="game" class="hide">
  <div class="cap-row" id="capBlack"></div>
  <div class="turn" id="turninfo"></div><div class="bd" id="bd"></div>
  <div class="cap-row" id="capWhite"></div>
  <div id="over" class="card hide" style="max-width:360px;margin:8px auto;text-align:center"><h1 id="ot"></h1><button class="sec" onclick="(typeof ws!=='undefined'&&ws&&ws.readyState===1?ws.send(JSON.stringify({action:'restart'})):location.reload())" data-i18n="restart_btn">Заново</button></div>

let LANG = localStorage.getItem('jg_lang') || 'ru';
if (!UI[LANG]) LANG = 'ru';

function t(k, vars) {
  let v = UI[LANG] && UI[LANG][k];
  if (v === undefined) v = UI.ru[k] || k;
  if (vars) {
    for (const key in vars) {
      v = v.replace('{' + key + '}', vars[key]);
    }
  }
  return v;
}

const GT = {
  "Нужно 2 игрока.": { uk: "Потрібно 2 гравці.", en: "Need 2 players.",
    de: "2 Spieler erforderlich." }
};

function T(s) {
  if (s == null) return s;
  if (LANG === 'ru') return s;
  const e = GT[s];
  return e && e[LANG] ? e[LANG] : (window.LobbyI18n ? LobbyI18n.T(s) : s);
}

function applyUI() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t(el.dataset.i18n);
    if (typeof v !== 'string') return;
    if (el.dataset.i18n === 'rules_body') el.innerHTML = v;
    else if (el.tagName.toLowerCase() === 'title') document.title = v;
    else el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = t(el.dataset.i18nTitle));
  document.querySelectorAll('#langbar button').forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
  if (st) render();
}

document.getElementById('langbar').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  LANG = b.dataset.lang;
  localStorage.setItem('jg_lang', LANG);
  applyUI();
});

document.addEventListener('DOMContentLoaded', applyUI);

function show(id){for(const s of['home','lobby','game'])document.getElementById(s).classList.add('hide');document.getElementById(id).classList.remove('hide');}
function send(o){if(ws)ws.send(o);}
function connect(cb){
  if (ws && ws.getSocket && ws.getSocket().readyState === 1) { if (cb) cb(); return; }
  firstOpenCb = cb;
  ws = JarvisWS("/games/ws", {
    onopen: () => {
      if (!opened) { opened = true; const f = firstOpenCb; firstOpenCb = null; if (f) f(); return; }
      if (roomCode) ws.send({ action: 'join', name: document.getElementById('name').value || 'Игрок', code: roomCode });
    },
    onmessage: (e) => handle(JSON.parse(e.data))
  });
}
function create(){connect(()=>send({action:'create',name:document.getElementById('name').value||'Игрок',game:'chess'}));}
function join(){const c=document.getElementById('joincode').value;if(!c)return alert(t('alert_code'));connect(()=>send({action:'join',name:document.getElementById('name').value||'Игрок',code:c}));}
function myColor(){ if(!st) return null; return st.order.indexOf(pid); }
function myLegal(r,c){ if(!st || st.turn_pid!==pid) return []; return st.legal[r+'_'+c] || []; }
function img(piece){ return '<img class="pc" draggable="false" src="/games/static/assets/chess/'+piece+'.svg">'; }
function tap(r,c){
  if(!st || st.turn_pid!==pid || st.done) return;
  if(sel){
    const legal = myLegal(sel[0],sel[1]);
    if(legal.some(m=>m[0]===r&&m[1]===c)){
      send({action:'chess_move', fr:sel[0], fc:sel[1], tr:r, tc:c, promo:'Q'});
      sel=null; render(); return;
    }
  }
  const piece = st.board[r][c];
  if(piece && myColor()===(piece[0]==='w'?0:1) && myLegal(r,c).length){ sel=[r,c]; } else { sel=null; }
  render();
}
function capturedPieces(board){
  const full = {P:8,N:2,B:2,R:2,Q:1};
  const have = {w:{P:0,N:0,B:0,R:0,Q:0}, b:{P:0,N:0,B:0,R:0,Q:0}};
  for(const row of board) for(const p of row) if(p && p[1]!=='K') have[p[0]][p[1]]++;
  const missing = (color) => Object.keys(full).flatMap(k => Array(Math.max(0, full[k]-have[color][k])).fill(k));
  return { w: missing('w'), b: missing('b') };
}
function render(){
  if(!st) return;
  const legal = sel ? myLegal(sel[0],sel[1]) : [];
  let h='';
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const light=(r+c)%2===0; const p=st.board[r][c];
    const isSel = sel && sel[0]===r && sel[1]===c;
    const isDest = legal.some(m=>m[0]===r&&m[1]===c);
    const isCapture = isDest && st.board[r][c];
    const isLast = st.last_move && ((st.last_move[0]===r&&st.last_move[1]===c)||(st.last_move[2]===r&&st.last_move[3]===c));
    const isCheckSq = st.in_check && p && p[1]==='K' && (p[0]==='w')===(st.turn_pid===st.order[0]);
    let cls='sq'+(light?' light':'')+(isSel?' sel':'')+(isDest?' dest':'')+(isCapture?' capture':'')+(isLast?' lastmove':'')+(isCheckSq?' check':'');
    h += '<div class="'+cls+'" onclick="tap('+r+','+c+')">'+(p?img(p):'')+'</div>';
  }
  document.getElementById('bd').innerHTML=h;
  const cap = capturedPieces(st.board);
  document.getElementById('capBlack').innerHTML = cap.w.map(k=>img('w'+k)).join('');
  document.getElementById('capWhite').innerHTML = cap.b.map(k=>img('b'+k)).join('');
  const myturn = st.turn_pid===pid;
  const ov=document.getElementById('over');
  if(st.done){
    ov.classList.remove('hide');
    let title = st.result==='checkmate' ? (st.winner===pid ? t('mate_win') : t('mate_loss', {n: st.names[st.winner]||'?'})) : t('draw_stalemate');
    document.getElementById('ot').textContent = title;
  } else {
    ov.classList.add('hide');
    let info = myturn ? '<span class="me">'+t('your_turn')+'</span>' : t('turn_of', {n: st.names[st.turn_pid]||'?'});
    if(st.in_check && myturn) info += ' — ' + t('check_excl');
    document.getElementById('turninfo').innerHTML = info;
  }
}
function handle(m){
  if(m.type==='joined'){pid=m.pid;roomCode=m.code;sessionStorage.setItem('jg_chess_code',m.code);}
  else if(m.type==='lobby'){show('lobby');document.getElementById('lcode').textContent=m.code;
    document.getElementById('players').innerHTML=m.players.map(p=>'<div class="pl">👤 '+p.name+'</div>').join('');}
  else if(m.type==='chess_state'){ st=m; show('game'); render(); }
  else if(m.type==='error'){alert(T(m.msg));}
}
const autoCode = sessionStorage.getItem('jg_chess_code');
if (autoCode) {
  const jc = document.getElementById('joincode');
  if (jc) jc.value = autoCode;
}
