<style>
  body {
    padding: max(12px, var(--sat)) 12px max(24px, var(--sab));
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .chess-wrap {
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .chess-hero-svg {
    width: 72px; height: 72px; margin: 0 auto 6px; display: block;
    filter: drop-shadow(0 10px 22px rgba(255, 34, 56, 0.35));
  }

  /* ── Player & Captured Bars ── */
  .player-bar {
    width: 100%; max-width: 404px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 6px 10px; border-radius: 14px;
    background: rgba(18, 18, 25, 0.78); border: 1px solid var(--border);
    min-height: 40px; margin: 4px auto; transition: border-color .25s, box-shadow .25s;
  }
  .player-bar.active {
    border-color: rgba(255, 34, 56, 0.65);
    box-shadow: 0 0 18px -6px var(--crimson-glow);
  }
  .pb-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pb-name {
    font-size: 13px; font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px;
  }
  .pb-clock {
    font-family: var(--display); font-size: 11px; font-weight: 700;
    padding: 3px 7px; border-radius: 8px; background: rgba(255, 255, 255, 0.06);
    color: var(--muted); flex-shrink: 0;
  }
  .player-bar.active .pb-clock { color: #fff; background: rgba(255, 34, 56, 0.25); }
  .cap-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 1px;
    min-height: 20px; justify-content: flex-end;
  }
  .cap-row svg { width: 17px; height: 17px; opacity: .92; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .mat-adv {
    font-size: 11px; font-weight: 800; color: #ffd43b; margin-left: 4px;
    padding: 1px 6px; border-radius: 999px; background: rgba(255, 204, 0, 0.14);
  }

  /* ── Tournament Board (Wood / Marble) ── */
  .bd-frame {
    width: 100%; max-width: 404px; margin: 6px auto;
    padding: 9px; border-radius: 18px;
    background: linear-gradient(155deg, #3b2619, #1c110b);
    border: 1px solid rgba(255, 215, 170, 0.18);
    box-shadow: var(--inner), var(--shadow-lg), 0 0 40px -16px rgba(0,0,0,.9);
    transition: background .3s;
  }
  .bd-frame.marble {
    background: linear-gradient(155deg, #27303c, #11151b);
    border-color: rgba(255, 255, 255, 0.16);
  }
  .bd {
    display: grid; grid-template-columns: repeat(8, 1fr);
    border-radius: 10px; overflow: hidden;
    border: 1px solid rgba(0, 0, 0, 0.35);
    aspect-ratio: 1; position: relative;
  }
  .sq {
    aspect-ratio: 1; background: #9c6a46;
    display: flex; align-items: center; justify-content: center;
    position: relative; cursor: pointer; transition: background-color 0.12s;
  }
  .sq.light { background: #eddcc2; }
  .bd-frame.marble .sq { background: #546b82; }
  .bd-frame.marble .sq.light { background: #e6ecf2; }

  .sq.lastmove { box-shadow: inset 0 0 0 100px rgba(255, 204, 0, 0.28); }
  .sq.sel {
    box-shadow: inset 0 0 0 3px var(--crimson), inset 0 0 0 100px rgba(255, 34, 56, 0.24) !important;
  }
  .sq.dest::after {
    content: ""; width: 28%; height: 28%; border-radius: 50%;
    background: rgba(20, 20, 28, 0.42);
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35);
    position: absolute; pointer-events: none; z-index: 3;
  }
  .sq.dest.capture::after {
    width: 84%; height: 84%; border-radius: 50%;
    background: transparent; border: 3.5px solid rgba(255, 34, 56, 0.85);
    box-shadow: 0 0 10px rgba(255, 34, 56, 0.45);
  }
  .sq.check {
    background: radial-gradient(circle, rgba(255, 52, 34, 0.92) 0%, rgba(180, 20, 20, 0.65) 75%) !important;
    animation: kingCheckPulse 1.1s ease-in-out infinite;
  }
  @keyframes kingCheckPulse {
    0%, 100% { box-shadow: inset 0 0 0 2px #ffcc00, 0 0 0 0 rgba(255, 34, 56, .6); }
    50% { box-shadow: inset 0 0 0 3px #ff2238, 0 0 16px 2px rgba(255, 34, 56, .75); }
  }
  .sq.cap-flash::before {
    content: ""; position: absolute; inset: 4px; border-radius: 50%;
    border: 3px solid #ffcc00; pointer-events: none; z-index: 4;
    animation: capBurst 0.36s ease-out forwards;
  }
  @keyframes capBurst {
    from { transform: scale(0.5); opacity: 1; }
    to { transform: scale(1.35); opacity: 0; }
  }

  .sq .coord {
    position: absolute; font-size: 9px; font-weight: 800; line-height: 1;
    opacity: 0.6; pointer-events: none; color: #3a2414;
  }
  .sq:not(.light) .coord { color: #f6ead6; }
  .bd-frame.marble .sq .coord { color: #1e293b; }
  .bd-frame.marble .sq:not(.light) .coord { color: #e2e8f0; }
  .sq .coord.r { top: 2px; left: 3px; }
  .sq .coord.f { bottom: 2px; right: 3px; }

  .pc {
    width: 86%; height: 86%; cursor: pointer; position: relative; z-index: 2;
    filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.48));
    user-select: none; -webkit-user-drag: none;
    transition: transform 0.14s var(--spring);
    will-change: transform;
  }
  .sq.sel .pc { transform: scale(1.09) translateY(-3px); }

  .board-tools {
    width: 100%; max-width: 404px; display: flex; align-items: center; justify-content: space-between;
    gap: 6px; margin: 6px auto 0; flex-wrap: wrap;
  }
  .tool-btn {
    width: auto !important; margin: 0 !important; padding: 8px 12px !important;
    font-size: 12px !important; border-radius: 12px !important;
    display: inline-flex; align-items: center; gap: 5px; min-height: 40px !important;
  }
</style>

/* ── 3D-shaded Staunton SVG piece set ── */
function pieceSvg(piece, cls = '') {
  const isW = piece[0] === 'w';
  const type = piece[1];
  const fill = isW ? 'url(#wGrad)' : 'url(#bGrad)';
  const stroke = isW ? '#4b3621' : '#94a3b8';
  const detail = isW ? '#7a5c3e' : '#cbd5e1';
  const defs = `<defs>
    <linearGradient id="wGrad" x1="10" y1="6" x2="36" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffef9"/><stop offset="55%" stop-color="#f0e2c8"/><stop offset="100%" stop-color="#cbb188"/>
    </linearGradient>
    <linearGradient id="bGrad" x1="10" y1="6" x2="36" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#525866"/><stop offset="55%" stop-color="#252830"/><stop offset="100%" stop-color="#0f1116"/>
    </linearGradient>
  </defs>`;
  let body = '';
  if (type === 'P') {
    body = `<circle cx="22.5" cy="14" r="5.5" fill="${fill}" stroke="${stroke}" stroke-width="1.6"/>
      <path d="M17.5 22c0-2 2.2-3.5 5-3.5s5 1.5 5 3.5c0 1.4-.9 2.4-1.8 3 1.4 3 3.3 7 4.3 10.5H15c1-3.5 2.9-7.5 4.3-10.5-.9-.6-1.8-1.6-1.8-3z" fill="${fill}" stroke="${stroke}" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="12.5" y="35.5" width="20" height="4.5" rx="2" fill="${fill}" stroke="${stroke}" stroke-width="1.6"/>`;
  } else if (type === 'R') {
    body = `<path d="M13 10h4v3h3.5v-3h4v3H28v-3h4v6l-2.5 2.5v13L32 35H13l2.5-3.5v-13L13 16v-6z" fill="${fill}" stroke="${stroke}" stroke-width="1.6" stroke-linejoin="round"/>
      <line x1="15.5" y1="18.5" x2="29.5" y2="18.5" stroke="${detail}" stroke-width="1.3"/>
      <rect x="11" y="35" width="23" height="5" rx="2" fill="${fill}" stroke="${stroke}" stroke-width="1.6"/>`;
  } else if (type === 'N') {
    body = `<path d="M15 35c.5-6.5 3-11 6-14-1.5-.5-4-1-5.5-2.5 1-2.5 3-5 5.5-7l-.5-3 3.5 2c4.5 0 8.5 4 9.5 10.5.7 4.5 0 9.5-1.5 14H15z" fill="${fill}" stroke="${stroke}" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="20.5" cy="15.5" r="1.3" fill="${detail}"/>
      <rect x="12" y="35" width="21" height="5" rx="2" fill="${fill}" stroke="${stroke}" stroke-width="1.6"/>`;
  } else if (type === 'B') {
    body = `<circle cx="22.5" cy="8.5" r="2.3" fill="${fill}" stroke="${stroke}" stroke-width="1.4"/>
      <path d="M22.5 11.5c-4.5 3-6.5 7.5-6.5 11.5 0 3.2 1.8 5.8 3.5 7.5L16 35h13l-3.5-4.5c1.7-1.7 3.5-4.3 3.5-7.5 0-4-2-8.5-6.5-11.5z" fill="${fill}" stroke="${stroke}" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M20 20l5 5M25 20l-5 5" stroke="${detail}" stroke-width="1.4" stroke-linecap="round"/>
      <rect x="12" y="35" width="21" height="5" rx="2" fill="${fill}" stroke="${stroke}" stroke-width="1.6"/>`;
  } else if (type === 'Q') {
    body = `<circle cx="10" cy="14" r="2" fill="${fill}" stroke="${stroke}" stroke-width="1.3"/>
      <circle cx="16" cy="10.5" r="2" fill="${fill}" stroke="${stroke}" stroke-width="1.3"/>
      <circle cx="22.5" cy="9" r="2.2" fill="${fill}" stroke="${stroke}" stroke-width="1.3"/>
      <circle cx="29" cy="10.5" r="2" fill="${fill}" stroke="${stroke}" stroke-width="1.3"/>
      <circle cx="35" cy="14" r="2" fill="${fill}" stroke="${stroke}" stroke-width="1.3"/>
      <path d="M11 16l4 15h15l4-15-5.5 7.5L26 13l-3.5 9.5L19 13l-2.5 10.5L11 16z" fill="${fill}" stroke="${stroke}" stroke-width="1.5" stroke-linejoin="round"/>
      <rect x="13" y="31" width="19" height="4" rx="1.5" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>
      <rect x="11.5" y="35" width="22" height="5" rx="2" fill="${fill}" stroke="${stroke}" stroke-width="1.6"/>`;
  } else if (type === 'K') {
    body = `<path d="M22.5 11.5V6M19.5 8.5h6" stroke="${isW ? '#b45309' : '#e2e8f0'}" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M22.5 12c-5 0-8.5 3-8.5 7.5 0 3.5 2 7 3.5 11.5h10c1.5-4.5 3.5-8 3.5-11.5 0-4.5-3.5-7.5-8.5-7.5z" fill="${fill}" stroke="${stroke}" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M16 31h13" stroke="${detail}" stroke-width="1.4"/>
      <rect x="12" y="35" width="21" height="5" rx="2" fill="${fill}" stroke="${stroke}" stroke-width="1.6"/>`;
  }
  return `<svg class="pc ${cls}" viewBox="0 0 45 45" aria-label="${esc(piece)}">${defs}${body}</svg>`;
}

function applyUI() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if (k === 'theme_btn') {
      el.textContent = marble ? t('theme_wood') : t('theme_marble');
      return;
    }
    const v = t(k);
    if (typeof v !== 'string') return;
    if (el.dataset.i18n === 'rules_body') el.innerHTML = v;
    else if (el.tagName.toLowerCase() === 'title') document.title = v;
    else {
      const sp = el.querySelector('span');
      if (sp) sp.textContent = v;
      else el.textContent = v;
    }
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = t(el.dataset.i18nTitle));
  document.querySelectorAll('#langbar button').forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
  if (st) render();
}

document.getElementById('langbar').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  LANG = b.dataset.lang;
  localStorage.setItem('jg_lang', LANG);
  applyUI();
});

document.addEventListener('DOMContentLoaded', () => {
  applyUI();
  if (window.LobbyUI && LobbyUI.initPinInput) LobbyUI.initPinInput('joincode', 'pinBoxes', join);
  document.getElementById('bdFrame').classList.toggle('marble', marble);
});

function pickDiff(el) {
  el.parentNode.querySelectorAll('.opt').forEach(x => x.classList.remove('on'));
  el.classList.add('on');
}

function copyRoomCode() {
  if (roomCode && window.LobbyUI) LobbyUI.copyText(roomCode, t('copied'));
}

function toggleTheme() {
  marble = !marble;
  localStorage.setItem('jg_chess_marble', marble ? '1' : '0');
  document.getElementById('bdFrame').classList.toggle('marble', marble);
  document.getElementById('themeBtn').textContent = marble ? t('theme_wood') : t('theme_marble');
  if (window.LobbyUI) LobbyUI.sound('click');
}

function toggleFlip() {
  manualFlip = !isFlipped();
  if (window.LobbyUI) { LobbyUI.sound('click'); LobbyUI.vibrate(8); }
  render();
}

function isFlipped() {
  if (manualFlip !== null) return manualFlip;
  return myColor() === 1;
}

function show(id) {
  if (window.LobbyUI) LobbyUI.showScreen(['home', 'lobby', 'game'], id);
  else {
    for (const s of ['home', 'lobby', 'game']) document.getElementById(s).classList.add('hide');
    document.getElementById(id).classList.remove('hide');
  }
}

function send(o) { if (ws) ws.send(o); }

function connect(cb) {
  if (ws && ws.getSocket && ws.getSocket().readyState === 1) { if (cb) cb(); return; }
  firstOpenCb = cb;
  ws = JarvisWS("/games/ws", {
    onopen: () => {
      if (!opened) { opened = true; const f = firstOpenCb; firstOpenCb = null; if (f) f(); return; }
      if (roomCode) ws.send({ action: 'join', name: document.getElementById('name').value || t('def_player'), code: roomCode });
    },
    onmessage: (e) => handle(JSON.parse(e.data))
  });
}

function create() { connect(() => send({ action: 'create', name: document.getElementById('name').value || t('def_player'), game: 'chess' })); }
function join() {
  const c = document.getElementById('joincode').value;
  if (!c) return window.LobbyUI ? LobbyUI.toast(t('alert_code'), 'err') : alert(t('alert_code'));
  connect(() => send({ action: 'join', name: document.getElementById('name').value || t('def_player'), code: c }));
}

function myColor() { if (!st) return null; return st.order.indexOf(pid); }
function myLegal(r, c) { if (!st || st.turn_pid !== pid) return []; return st.legal[r + '_' + c] || []; }

function fmtClock(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function startClockLoop() {
  if (clockTimer) return;
  clockTimer = setInterval(() => {
    if (!st || st.done) return;
    const idx = st.order.indexOf(st.turn_pid);
    if (idx === 0 || idx === 1) clocks[idx]++;
    const flipped = isFlipped();
    const topIdx = flipped ? 0 : 1, botIdx = flipped ? 1 : 0;
    const tc = document.getElementById('topClock'), bc = document.getElementById('botClock');
    if (tc) tc.textContent = fmtClock(clocks[topIdx]);
    if (bc) bc.textContent = fmtClock(clocks[botIdx]);
  }, 1000);
}

function tap(r, c) {
  if (!st || st.turn_pid !== pid || st.done) return;
  if (sel) {
    const legal = myLegal(sel[0], sel[1]);
    if (legal.some(m => m[0] === r && m[1] === c)) {
      const isCap = !!st.board[r][c];
      if (window.LobbyUI) {
        LobbyUI.sound(isCap ? 'flip' : 'move');
        LobbyUI.vibrate(isCap ? 18 : 10);
      }
      send({ action: 'chess_move', fr: sel[0], fc: sel[1], tr: r, tc: c, promo: 'Q' });
      sel = null;
      render();
      return;
    }
  }
  const piece = st.board[r][c];
  if (piece && myColor() === (piece[0] === 'w' ? 0 : 1) && myLegal(r, c).length) {
    sel = [r, c];
    if (window.LobbyUI) LobbyUI.vibrate(6);
  } else {
    sel = null;
  }
  render();
}

function capturedPieces(board) {
  const full = { P: 8, N: 2, B: 2, R: 2, Q: 1 };
  const have = { w: { P: 0, N: 0, B: 0, R: 0, Q: 0 }, b: { P: 0, N: 0, B: 0, R: 0, Q: 0 } };
  for (const row of board) for (const p of row) if (p && p[1] !== 'K') have[p[0]][p[1]]++;
  const missing = (color) => Object.keys(full).flatMap(k => Array(Math.max(0, full[k] - have[color][k])).fill(k));
  const wMiss = missing('w'), bMiss = missing('b');
  const wVal = wMiss.reduce((a, k) => a + PIECE_VAL[k], 0);
  const bVal = bMiss.reduce((a, k) => a + PIECE_VAL[k], 0);
  return { w: wMiss, b: bMiss, advW: bVal - wVal, advB: wVal - bVal };
}

function render() {
  if (!st) return;
  const legal = sel ? myLegal(sel[0], sel[1]) : [];
  const flipped = isFlipped();
  const lm = st.last_move;
  const lmKey = lm ? lm.join(',') : '';
  const isNewMove = lmKey && lmKey !== lastMoveKey;
  const wasCapture = isNewMove && lastBoard && lm && !!lastBoard[lm[2]][lm[3]];
  if (isNewMove) lastMoveKey = lmKey;

  const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
  let h = '';
  for (let ri = 0; ri < 8; ri++) {
    for (let ci = 0; ci < 8; ci++) {
      const r = flipped ? 7 - ri : ri;
      const c = flipped ? 7 - ci : ci;
      const light = (r + c) % 2 === 0;
      const p = st.board[r][c];
      const isSel = sel && sel[0] === r && sel[1] === c;
      const isDest = legal.some(m => m[0] === r && m[1] === c);
      const isCapture = isDest && st.board[r][c];
      const isLast = lm && ((lm[0] === r && lm[1] === c) || (lm[2] === r && lm[3] === c));
      const isMovedDest = isNewMove && lm && lm[2] === r && lm[3] === c;
      const isCheckSq = st.in_check && p && p[1] === 'K' && (p[0] === 'w') === (st.turn_pid === st.order[0]);
      let cls = 'sq' + (light ? ' light' : '') + (isSel ? ' sel' : '') + (isDest ? ' dest' : '') + (isCapture ? ' capture' : '') + (isLast ? ' lastmove' : '') + (isCheckSq ? ' check' : '') + (isMovedDest && wasCapture ? ' cap-flash' : '');
      const rankLbl = ci === 0 ? `<span class="coord r">${8 - r}</span>` : '';
      const fileLbl = ri === 7 ? `<span class="coord f">${files[c]}</span>` : '';
      h += `<div class="${cls}" data-rc="${r}_${c}" onclick="tap(${r},${c})">${rankLbl}${fileLbl}${p ? pieceSvg(p, isMovedDest ? 'moved-pc' : '') : ''}</div>`;
    }
  }
  const bdEl = document.getElementById('bd');
  bdEl.innerHTML = h;

  // Smooth FLIP slide animation for the moved piece
  if (isNewMove && lm) {
    const fromSq = bdEl.querySelector(`[data-rc="${lm[0]}_${lm[1]}"]`);
    const toSq = bdEl.querySelector(`[data-rc="${lm[2]}_${lm[3]}"]`);
    const pcEl = toSq && toSq.querySelector('.pc');
    if (fromSq && toSq && pcEl) {
      const fr = fromSq.getBoundingClientRect();
      const tr = toSq.getBoundingClientRect();
      const dx = fr.left - tr.left;
      const dy = fr.top - tr.top;
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
        pcEl.style.transition = 'none';
        pcEl.style.transform = `translate(${dx}px, ${dy}px) scale(1.06)`;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            pcEl.style.transition = 'transform 220ms cubic-bezier(.22, 1, .36, 1)';
            pcEl.style.transform = 'translate(0, 0) scale(1)';
          });
        });
      }
    }
  }
  lastBoard = st.board.map(row => row.slice());

  const cap = capturedPieces(st.board);
  const wPid = st.order[0], bPid = st.order[1];
  const topIsWhite = flipped;
  const topPid = topIsWhite ? wPid : bPid;
  const botPid = topIsWhite ? bPid : wPid;
  const topNm = T(st.names[topPid] || '?');
  const botNm = T(st.names[botPid] || '?');

  document.getElementById('topName').textContent = topNm;
  document.getElementById('botName').textContent = botNm;
  if (window.LobbyUI && LobbyUI.avatarHtml) {
    document.getElementById('topAv').innerHTML = LobbyUI.avatarHtml(topNm, String(topPid || '').startsWith('bot_'));
    document.getElementById('botAv').innerHTML = LobbyUI.avatarHtml(botNm, String(botPid || '').startsWith('bot_'));
  }
  document.getElementById('topBar').classList.toggle('active', !st.done && st.turn_pid === topPid);
  document.getElementById('botBar').classList.toggle('active', !st.done && st.turn_pid === botPid);

  const renderCap = (pieces, colorPrefix, adv) =>
    pieces.map(k => pieceSvg(colorPrefix + k)).join('') + (adv > 0 ? `<span class="mat-adv">+${adv}</span>` : '');

  document.getElementById('capBlack').innerHTML = topIsWhite
    ? renderCap(cap.b, 'b', cap.advW)
    : renderCap(cap.w, 'w', cap.advB);
  document.getElementById('capWhite').innerHTML = topIsWhite
    ? renderCap(cap.w, 'w', cap.advB)
    : renderCap(cap.b, 'b', cap.advW);

  const myturn = st.turn_pid === pid;
  const ov = document.getElementById('over');
  const tp = document.getElementById('turninfo');
  if (st.done) {
    ov.classList.remove('hide');
    tp.className = 'turn-pill opp-turn';
    const wName = T(st.names[st.winner] || '?');
    let title = st.result === 'checkmate'
      ? (st.winner === pid ? t('mate_win') : t('mate_loss', { n: wName }))
      : t('draw_stalemate');
    document.getElementById('ot').textContent = title;
    if (!celebrated) {
      celebrated = true;
      if (st.winner === pid && window.LobbyUI) {
        LobbyUI.confetti({ particleCount: 110, spread: 85 });
        LobbyUI.sound('win');
        LobbyUI.vibrate([20, 40, 30]);
      } else if (window.LobbyUI) {
        LobbyUI.sound('lose');
      }
    }
  } else {
    celebrated = false;
    ov.classList.add('hide');
    tp.className = 'turn-pill ' + (myturn ? 'my-turn' : 'opp-turn');
    const curNm = T(st.names[st.turn_pid] || '?');
    let info = myturn ? t('your_turn') : t('turn_of', { n: curNm });
    if (st.in_check) info += ' — ' + t('check_excl');
    document.getElementById('turntext').textContent = info;
  }
}

function handle(m) {
  if (m.type === 'joined') {
    pid = m.pid; roomCode = m.code;
    sessionStorage.setItem('jg_chess_code', m.code);
  }
  else if (m.type === 'lobby') {
    show('lobby');
    document.getElementById('lcode').textContent = m.code;
    const ld = document.getElementById('lcodeDigits');
    if (ld && window.LobbyUI) ld.innerHTML = LobbyUI.renderCodeDigits(m.code);
    document.getElementById('roomFullNote').classList.toggle('hide', (m.players || []).length < 2);
    document.getElementById('players').innerHTML = (m.players || []).map(p => {
      const nm = T(p.name);
      const av = window.LobbyUI ? LobbyUI.avatarHtml(nm, String(p.id || '').startsWith('bot_')) : '';
      return `<div class="player-row-item">${av}<span>${esc(nm)}</span>${p.id === m.host ? '<span class="player-tag">HOST</span>' : ''}</div>`;
    }).join('');
  }
  else if (m.type === 'chess_state') {
    st = m;
    show('game');
    startClockLoop();
    render();
  }
  else if (m.type === 'error') {
    const msg = T(m.msg);
    if (window.LobbyUI) LobbyUI.toast(msg, 'err');
    else alert(msg);
  }
}

const autoCode = sessionStorage.getItem('jg_chess_code');
if (autoCode) {
  const jc = document.getElementById('joincode');
  if (jc) jc.value = autoCode;
}
</script>
