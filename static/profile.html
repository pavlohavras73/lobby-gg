<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title data-i18n="title">Lobby.gg — Профиль</title>
<link rel="icon" type="image/svg+xml" href="/games/static/favicon.svg">
<link rel="stylesheet" href="/games/static/theme.css">
<style>
  body{display:flex;flex-direction:column;align-items:center;padding:12px;-webkit-user-select:none;user-select:none}
  .wrap{max-width:460px;width:100%}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
  .phead{display:flex;align-items:center;gap:14px}
  .avatar{width:66px;height:66px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0}
  .phead .nm{font-size:20px;font-weight:800;word-break:break-word}
  .phead .role{font-size:12px;color:var(--muted)}
  .stats{display:flex;gap:8px;margin-top:12px}
  .stat{flex:1;min-width:0;background:rgba(255,255,255,.04);border-radius:10px;padding:8px 6px;text-align:center}
  .stat .v{font-size:20px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stat .l{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sh{font-weight:800;color:var(--crimson);margin:2px 0 10px;font-size:15px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input{width:100%;box-sizing:border-box;margin:0;text-align:left}
  .emoji-grid{display:flex;flex-wrap:wrap;gap:6px}
  .emo{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04);
    display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
  .emo.on{border-color:var(--crimson);background:rgba(255,34,56,.16);box-shadow:0 0 10px var(--crimson-glow)}
  .colors{display:flex;gap:8px;flex-wrap:wrap}
  .col{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent}
  .col.on{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.4)}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
  .sw{width:48px;height:28px;border-radius:14px;background:#3a3d44;position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
  .sw.on{background:#2fbf5f}.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
  .sw.on::after{left:23px}
  .frow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .frow .fav{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .frow .fn{flex:1;min-width:90px;font-weight:700;word-break:break-word}
  .frow button{margin:0;padding:6px 10px;font-size:12.5px;width:auto}
  .btn-mini{padding:6px 10px !important;font-size:12.5px !important;width:auto !important;margin:0 !important}
  .backlink{display:inline-flex;align-items:center;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:700;white-space:nowrap}
  .backlink:hover{color:#fff}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;border:1px solid var(--border);
    padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;z-index:50;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}
  .empty{color:var(--muted);font-size:13px;padding:8px 0}

  .langbar{display:flex;gap:2px;justify-content:center;margin:0;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:999px;padding:3px;width:max-content;flex-shrink:0}
  .langbar button{width:auto;margin:0;border:0;background:transparent;box-shadow:none;color:var(--muted);font:inherit;font-weight:800;font-size:11px;padding:4px 8px;border-radius:999px;cursor:pointer;letter-spacing:.3px}
  .langbar button::after{display:none}
  .langbar button.active{background:var(--crimson);color:#fff;box-shadow:0 0 12px rgba(255,34,56,.4)}
  @media (max-width:360px){
    body{padding:10px 8px}
    .card{padding:13px}
    .langbar button{padding:3px 6px;font-size:10px;letter-spacing:0}
    .backlink{font-size:12.5px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="backlink" href="/games/" data-i18n="nav_games">← К играм</a>
    <div class="langbar" id="langbar"><button type="button" data-lang="uk">УКР</button><button type="button" data-lang="ru">РУС</button><button type="button" data-lang="en">ENG</button><button type="button" data-lang="de">DEU</button></div>
  </div>

  <!-- ШАПКА ПРОФИЛЯ -->
  <div class="card">
    <div class="phead">
      <div class="avatar" id="pAvatar">🙂</div>
      <div style="flex:1;min-width:0">
        <div class="nm" id="pName">—</div>
        <div class="role" id="pRole"></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="v" id="sPlayed">—</div><div class="l" data-i18n="played">сыграно</div></div>
      <div class="stat"><div class="v" id="sFav" style="font-size:14px">—</div><div class="l" data-i18n="fav">любимая</div></div>
      <div class="stat"><div class="v" id="sFriends">—</div><div class="l" data-i18n="friends">друзей</div></div>
    </div>
  </div>

  <!-- ДРУЗЬЯ -->
  <div class="card">
    <div class="sh" data-i18n="friends_title">👥 Друзья</div>
    <div id="incoming"></div>
    <div id="friends"></div>
    <label data-i18n="search_lbl">Найти игрока по нику</label>
    <div style="display:flex;gap:8px">
      <input id="search" placeholder="ник друга" data-i18n-ph="search_ph" oninput="doSearch()" style="flex:1">
    </div>
    <div id="searchRes"></div>
  </div>

  <!-- НАСТРОЙКИ -->
  <div class="card">
    <div class="sh" data-i18n="settings_title">⚙️ Настройки профиля</div>
    <label data-i18n="name_lbl">Отображаемое имя</label>
    <input id="dispName" maxlength="24" placeholder="как тебя видят" data-i18n-ph="name_ph">
    <label data-i18n="avatar_lbl">Аватар</label>
    <div class="emoji-grid" id="emojiGrid"></div>
    <label data-i18n="color_lbl">Цвет</label>
    <div class="colors" id="colorGrid"></div>
    <div class="toggle"><span data-i18n="sound_lbl">🔊 Звук в играх</span><div class="sw" id="soundSw" onclick="toggleSound()"></div></div>
    <button onclick="saveProfile()" style="margin-top:14px" data-i18n="save_btn">💾 Сохранить</button>
  </div>

  <!-- ПАРОЛЬ -->
  <div class="card">
    <div class="sh" data-i18n="pwd_title">🔒 Смена пароля</div>
    <label data-i18n="pwd_old">Старый пароль</label><input id="oldPw" type="password" data-i18n-ph="pwd_old">
    <label data-i18n="pwd_new">Новый пароль</label><input id="newPw" type="password" data-i18n-ph="pwd_new">
    <button class="sec" onclick="changePw()" style="margin-top:12px" data-i18n="pwd_btn">Обновить пароль</button>
  </div>
  
  <!-- SUPPORT INBOX (Admin Only) -->
  <div class="card hide" id="adminSupportInbox">
    <div class="sh" style="display:flex; justify-content:space-between; align-items:center">
      <span data-i18n="sup_title">Support inbox</span>
      <span class="pc-badge" id="supportUnreadBadge" style="display:none">0</span>
    </div>
    
    <div style="display:flex; gap:8px; margin-bottom:12px">
      <select id="supFilter" onchange="loadSupportTickets()" style="flex:1;min-width:0;padding:6px 30px 6px 10px; background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:8px; color:#fff">
        <option value="" data-i18n="sup_all">All</option>
        <option value="new" data-i18n="sup_new">New</option>
        <option value="in_progress" data-i18n="sup_prog">In Progress</option>
        <option value="done" data-i18n="sup_done">Done</option>
      </select>
      <button class="sec btn-mini" style="flex-shrink:0;white-space:nowrap" onclick="loadSupportTickets()" data-i18n="sup_refresh">Refresh</button>
    </div>
    
    <div id="supportTicketsList" style="display:flex; flex-direction:column; gap:12px"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

const EMOJIS=['🙂','😎','🐺','🦊','🐱','🐶','🦁','🐯','🐸','🐵','🦉','🦅','🐢','🐉','👾','🤖','👑','💀','🔥','⚡','🌟','🍀','🎮','🎯','🃏','🚀','🐧','🦈','🌚','🎭'];
const COLORS=['#e0102e','#f59e0b','#22c55e','#3b82f6','#a04bf0','#2fd9d9','#ff6b9d','#94a3b8'];

let LANG = localStorage.getItem('jg_lang') || 'ru';
if (!UI[LANG]) LANG = 'ru';
let prof = { avatar: '🙂', color: '#e0102e', sound: 1, display_name: '', username: '', role: '', stats: null };
let friendsCache = null;
let searchCache = null;
let activeCallUser = null;
let searchT = null;

function t(k) { return UI[LANG] && UI[LANG][k] !== undefined ? UI[LANG][k] : (UI.ru[k] || k); }
function srvErr(e) {
  if (!e) return t('err_generic');
  return (window.LobbyI18n && window.LobbyI18n.T) ? window.LobbyI18n.T(e) : e;
}
function gameLabel(g) {
  const m = GAME_LABELS[g];
  return (m && (m[LANG] || m.ru)) || g;
}

function renderProfileMeta() {
  if (!prof || !prof.username) return;
  document.getElementById('pRole').textContent = (prof.role === 'root' ? t('role_admin') : t('role_player')) + ' · @' + prof.username;
  const st = prof.stats || {};
  document.getElementById('sFav').textContent = st.top_games && st.top_games[0] ? gameLabel(st.top_games[0][0]) : '—';
}

function applyUI() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t(el.dataset.i18n);
    if (typeof v !== 'string') return;
    if (el.tagName.toLowerCase() === 'title') document.title = v;
    else el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('#langbar button').forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
  renderProfileMeta();
  renderFriends();
  renderSearch();
  if (activeCallUser && document.getElementById('callModal')) callToGame(activeCallUser);
}

function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function jget(p){const r=await fetch('/games'+p,{credentials:'include'});return r.ok?r.json():null;}
async function jpost(p,b){const r=await fetch('/games'+p,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return r.ok?r.json():{ok:false};}

function buildPickers(){
  document.getElementById('emojiGrid').innerHTML=EMOJIS.map(e=>`<div class="emo" data-e="${e}" onclick="pickEmoji('${e}')">${e}</div>`).join('');
  document.getElementById('colorGrid').innerHTML=COLORS.map(c=>`<div class="col" data-c="${c}" style="background:${c}" onclick="pickColor('${c}')"></div>`).join('');
}
function pickEmoji(e){prof.avatar=e;syncPickers();}
function pickColor(c){prof.color=c;syncPickers();}
function toggleSound(){prof.sound=prof.sound?0:1;document.getElementById('soundSw').classList.toggle('on',!!prof.sound);}
function syncPickers(){
  document.querySelectorAll('.emo').forEach(el=>el.classList.toggle('on',el.dataset.e===prof.avatar));
  document.querySelectorAll('.col').forEach(el=>el.classList.toggle('on',el.dataset.c===prof.color));
  document.getElementById('pAvatar').textContent=prof.avatar;
  document.getElementById('pAvatar').style.background=prof.color;
}

async function loadProfile(){
  const d=await jget('/me');
  if(!d||!d.profile){toast(t('not_logged'));return;}
  prof=Object.assign(prof,d.profile);
  document.getElementById('pName').textContent=prof.display_name;
  document.getElementById('dispName').value=prof.display_name;
  document.getElementById('soundSw').classList.toggle('on',!!prof.sound);
  const st=d.profile.stats||{};
  document.getElementById('sPlayed').textContent=st.played||0;
  renderProfileMeta();
  syncPickers();
  
  if(prof.role === 'root') {
    document.getElementById('adminSupportInbox').classList.remove('hide');
    loadSupportTickets();
  }
}

async function loadSupportTickets() {
  const status = document.getElementById('supFilter').value;
  const d = await jget(`/api/support/tickets?status=${encodeURIComponent(status)}`);
  if(!d || !d.ok) return;
  
  const badge = document.getElementById('supportUnreadBadge');
  if(d.unread > 0) {
    badge.style.display = 'inline-block';
    badge.textContent = d.unread;
  } else {
    badge.style.display = 'none';
  }
  
  const list = document.getElementById('supportTicketsList');
  list.innerHTML = '';
  
  if(!d.tickets.length) {
    list.innerHTML = `<div class="empty">${esc(t('sup_empty'))}</div>`;
    return;
  }
  
  d.tickets.forEach(tk => {
    const card = document.createElement('div');
    card.style.cssText = 'background:rgba(0,0,0,.2); border:1px solid var(--border); border-radius:12px; padding:12px';
    
    let stColor = '#555';
    if(tk.status === 'new') stColor = '#2fbf5f';
    else if(tk.status === 'in_progress') stColor = '#f59e0b';
    
    const ts = new Date(tk.created_at).toLocaleString(LANG === 'uk' ? 'uk-UA' : LANG);
    
    card.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px">
        <div style="display:flex; gap:6px; align-items:center">
          <span style="background:rgba(255,255,255,.1); padding:2px 8px; border-radius:6px; font-size:11px; font-weight:800">${esc(t('cat_' + tk.category) !== 'cat_' + tk.category ? t('cat_' + tk.category) : tk.category)}</span>
          <span style="font-size:11px; color:var(--muted)">${esc(ts)} · ${esc(tk.page)} / ${esc(tk.lang)}</span>
        </div>
        <span style="background:${stColor}; color:#fff; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:800">${esc(t({new:'sup_new', in_progress:'sup_prog', done:'sup_done'}[tk.status] || tk.status))}</span>
      </div>
      <div style="font-size:13px; font-weight:700; margin-bottom:4px">${esc(tk.username || t('sup_guest'))} <span style="font-weight:400; color:var(--muted)">${esc(tk.contact || '')}</span></div>
      <div style="font-size:14px; margin-bottom:12px; white-space:pre-wrap; word-break:break-word">${esc(tk.message)}</div>
      
      <div style="display:flex; gap:6px; margin-bottom:8px">
        <input type="text" id="note_${tk.id}" value="${esc(tk.admin_note || '')}" placeholder="${esc(t('sup_note'))}" style="flex:1; padding:6px; font-size:12px; background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:6px; color:#fff">
        <button class="sec btn-mini" onclick="updateTicket(${tk.id}, null, document.getElementById('note_${tk.id}').value)">${esc(t('sup_save'))}</button>
      </div>
      
      <div style="display:flex; gap:6px">
        <button class="btn-mini" style="background:#f59e0b; color:#fff" onclick="updateTicket(${tk.id}, 'in_progress', null)">${esc(t('sup_prog'))}</button>
        <button class="btn-mini" style="background:#222; color:#fff" onclick="updateTicket(${tk.id}, 'done', null)">${esc(t('sup_done'))}</button>
      </div>
    `;
    list.appendChild(card);
  });
}

async function updateTicket(id, status, note) {
  const payload = {};
  if(status !== null) payload.status = status;
  if(note !== null) payload.admin_note = note;
  
  const r = await jpost(`/api/support/tickets/${id}`, payload);
  if(r.ok) {
    toast('Ticket updated');
    loadSupportTickets();
    // Refresh global badge if it exists
    if(window.LobbyShell && window.LobbyShell.refreshProfile) {
      window.LobbyShell.refreshProfile();
    }
  } else {
    toast('Failed to update ticket');
  }
}

function renderFriends(){
  const d = friendsCache;
  if (!d) return;
  document.getElementById('sFriends').textContent=(d.friends||[]).length;
  document.getElementById('incoming').innerHTML=(d.incoming||[]).map(u=>
    `<div class="frow"><div class="fav" style="background:${u.color}">${u.avatar}</div>
      <div class="fn">${esc(u.display_name)}<div style="font-size:11px;color:var(--muted)">${esc(t('req_in'))}</div></div>
      <button class="btn-mini" onclick="respond('${esc(u.username)}',true)">${esc(t('btn_accept'))}</button>
      <button class="sec btn-mini" onclick="respond('${esc(u.username)}',false)">${esc(t('btn_reject'))}</button></div>`).join('');
  const fr = [...(d.friends||[])];
  fr.sort((a,b)=>(b.online?1:0)-(a.online?1:0));
  document.getElementById('friends').innerHTML=fr.length?fr.map(u=>{
    const dot=u.online?'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fbf5f;margin-right:5px;box-shadow:0 0 6px #2fbf5f"></span>'
                      :'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:5px"></span>';
    const status=u.online?(u.game?(t('status_ingame')+gameLabel(u.game)):t('status_online')):t('status_offline');
    return `<div class="frow"><div class="fav" style="background:${u.color}">${u.avatar}</div>
      <div class="fn">${dot}${esc(u.display_name)}<div style="font-size:11px;color:${u.online?'#2fbf5f':'var(--muted)'}">${esc(status)}</div></div>
      <button class="btn-mini" onclick="callToGame('${esc(u.username)}')">${esc(t('btn_invite'))}</button>
      <button class="sec btn-mini" onclick="removeFriend('${esc(u.username)}')">${esc(t('btn_remove'))}</button></div>`;}).join('')
    :`<div class="empty">${esc(t('empty_friends'))}</div>`;
}

async function loadFriends(){
  const d=await jget('/friends');
  if(!d)return;
  friendsCache=d;
  renderFriends();
}

function closeCallModal(){
  activeCallUser=null;
  const m=document.getElementById('callModal');
  if(m)m.remove();
}

function callToGame(user){
  activeCallUser=user;
  let m=document.getElementById('callModal');
  if(!m){m=document.createElement('div');m.id='callModal';
    m.style.cssText='position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)';
    m.onclick=e=>{if(e.target===m)closeCallModal();};
    document.body.appendChild(m);}
  m.innerHTML=`<div style="max-width:340px;width:100%;background:#15151b;border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:20px;max-height:85vh;overflow-y:auto">
    <div style="font-size:17px;font-weight:800;margin-bottom:4px">${esc(t('call_title'))} @${esc(user)}</div>
    <div style="font-size:12px;color:#9a9aa4;margin-bottom:12px">${esc(t('call_sub'))}</div>
    ${CALL_GAMES.map(([g,ico])=>`<button class="btn-mini" style="width:100% !important;text-align:left;margin:5px 0 !important;padding:11px 13px !important" onclick="location.href='/games/${g}?invite=${encodeURIComponent(user)}'">${ico} ${esc(gameLabel(g))}</button>`).join('')}
    <button class="sec btn-mini" style="width:100% !important;margin-top:8px !important" onclick="closeCallModal()">${esc(t('cancel_btn'))}</button></div>`;
  m.style.display='flex';
}

function renderSearch(){
  const q=document.getElementById('search').value.trim();
  if(!q || !searchCache){document.getElementById('searchRes').innerHTML='';return;}
  document.getElementById('searchRes').innerHTML=(searchCache||[]).map(u=>
    `<div class="frow"><div class="fav" style="background:${u.color}">${u.avatar}</div>
      <div class="fn">${esc(u.display_name)}<div style="font-size:11px;color:var(--muted)">@${esc(u.username)}</div></div>
      <button class="btn-mini" onclick="addFriend('${esc(u.username)}')">${esc(t('btn_add'))}</button></div>`).join('')
    ||`<div class="empty">${esc(t('empty_search'))}</div>`;
}

function doSearch(){clearTimeout(searchT);searchT=setTimeout(async()=>{
  const q=document.getElementById('search').value.trim();
  if(!q){searchCache=null;document.getElementById('searchRes').innerHTML='';return;}
  const d=await jget('/users/search?q='+encodeURIComponent(q));
  searchCache=(d&&d.users)||[];
  renderSearch();
},300);}

async function addFriend(u){const r=await jpost('/friends/request',{to:u});
  toast(r.ok?(r.accepted?t('toast_friends_now'):t('toast_req')):srvErr(r.error));loadFriends();}
async function respond(u,ok){await jpost('/friends/respond',{from:u,accept:ok});toast(ok?t('toast_accepted'):t('toast_rejected'));loadFriends();}
async function removeFriend(u){await jpost('/friends/remove',{user:u});loadFriends();}

async function saveProfile(){
  prof.display_name=document.getElementById('dispName').value.trim()||prof.username;
  const r=await jpost('/me',{display_name:prof.display_name,avatar:prof.avatar,color:prof.color,sound:!!prof.sound});
  if(r.ok){toast(t('toast_saved'));document.getElementById('pName').textContent=prof.display_name;}else toast(srvErr(r.error));
}
async function changePw(){
  const o=document.getElementById('oldPw').value,n=document.getElementById('newPw').value;
  if(!o||!n)return toast(t('pwd_fill_both'));
  const r=await jpost('/me/password',{old:o,new:n});
  if(r.ok){toast(t('toast_pwd_ok'));document.getElementById('oldPw').value='';document.getElementById('newPw').value='';}
  else toast(srvErr(r.error));
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('langbar').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    LANG = b.dataset.lang;
    localStorage.setItem('jg_lang', LANG);
    applyUI();
  });
  buildPickers();
  applyUI();
  loadProfile();
  loadFriends();
});
</script>
<script src="/games/static/sfx.js"></script>
</body>
</html>
